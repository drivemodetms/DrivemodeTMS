<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drive Mode TMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1720; --panel:#16212E; --panel2:#1C2A3A; --border:#28394C;
  --text:#E9EEF4; --dim:#8FA3B8; --accent:#FF6A1A; --accent2:#3EA36E;
  --warn:#F0A93B; --danger:#E5555C; --radius:10px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{
  margin:0; height:100%; background:var(--bg); color:var(--text);
  font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.logo,.stat-num{font-family:'Big Shoulders Display',system-ui,sans-serif;}
::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

/* ---------- LOGIN ---------- */
#login{min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px;
  background:radial-gradient(1200px 600px at 15% -10%, #1a2b3d 0%, var(--bg) 60%);}
.login-card{width:100%; max-width:460px; background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:40px 36px;}
.login-logo{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
.login-logo .mark{width:14px;height:34px;background:var(--accent);border-radius:3px; transform:skewX(-12deg);}
.login-logo span{font-size:30px; font-weight:800; letter-spacing:0.5px;}
.login-sub{color:var(--dim); font-size:14px; margin-bottom:28px;}
.login-foot{margin-top:26px; font-size:12px; color:var(--dim); line-height:1.6;}

/* ---------- APP SHELL ---------- */
#app{display:none; min-height:100dvh;}
.shell{display:flex; min-height:100dvh;}
.sidebar{width:230px; flex:none; background:var(--panel); border-right:1px solid var(--border);
  padding:22px 14px; display:flex; flex-direction:column; gap:4px; position:sticky; top:0; height:100dvh; overflow-y:auto;}
.sidebar .logo{display:flex; align-items:center; gap:8px; padding:0 8px 20px; font-size:20px; font-weight:800;}
.sidebar .logo .mark{width:10px;height:22px;background:var(--accent);border-radius:2px; transform:skewX(-12deg);}
.nav-item{padding:11px 12px; border-radius:8px; color:var(--dim); font-size:14px; font-weight:500; cursor:pointer; display:flex; align-items:center; gap:10px; border:1px solid transparent;}
.nav-item:hover{background:var(--panel2); color:var(--text);}
.nav-item.active{background:#2A2013; color:var(--accent); border-color:#4A3220;}
.nav-item.locked{opacity:.4; cursor:default;}
.nav-item.locked:hover{background:none; color:var(--dim);}
.sidebar-foot{margin-top:auto; padding:12px 8px 0; border-top:1px solid var(--border);}
.who{font-size:13px; font-weight:600;}
.who-role{font-size:11px; color:var(--dim); text-transform:capitalize; margin-bottom:10px;}
.logout-btn{width:100%; padding:9px; background:transparent; border:1px solid var(--border); color:var(--dim); border-radius:8px; cursor:pointer; font-size:13px;}
.logout-btn:hover{color:var(--text); border-color:var(--accent);}

.main{flex:1; min-width:0; padding:26px 30px 60px;}
.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:12px;}
.topbar h1{font-size:28px; margin:0; font-weight:700;}
.topbar .desc{color:var(--dim); font-size:13px; margin-top:2px;}
.btn{background:var(--accent); color:#1a0d02; border:none; padding:10px 18px; border-radius:8px; font-weight:700; font-size:13.5px; cursor:pointer; font-family:'Inter',sans-serif;}
.btn:hover{filter:brightness(1.08);}
.btn.secondary{background:var(--panel2); color:var(--text); border:1px solid var(--border);}
.btn.small{padding:6px 12px; font-size:12.5px;}

/* ---------- DASHBOARD ---------- */
.kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px;}
.kpi{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px;}
.kpi .lbl{font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.04em;}
.stat-num{font-size:30px; font-weight:700; margin:6px 0 2px;}
.kpi .sub{font-size:12px; color:var(--dim);}
.kpi.accent .stat-num{color:var(--accent);}
.kpi.good .stat-num{color:var(--accent2);}
.kpi.warn .stat-num{color:var(--warn);}
.kpi.bad .stat-num{color:var(--danger);}

.dash-cols{display:grid; grid-template-columns:1.3fr 1fr; gap:16px;}
.panel{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px;}
.panel h3{margin:0 0 14px; font-size:16px; font-weight:700;}
.row-item{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); font-size:13.5px;}
.row-item:last-child{border-bottom:none;}
.row-item .t1{font-weight:600;}
.row-item .t2{color:var(--dim); font-size:12px;}
.pill{padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; white-space:nowrap;}
.alert-item{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); font-size:13px;}
.alert-item:last-child{border-bottom:none;}
.alert-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none;}
.alert-dot.bad{background:var(--danger);} .alert-dot.warn{background:var(--warn);}
.empty{color:var(--dim); font-size:13px; padding:8px 0;}

/* ---------- DISPATCH TABLE ---------- */
.filters{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
.filters select,.filters input{background:var(--panel2); border:1px solid var(--border); color:var(--text); padding:8px 10px; border-radius:8px; font-size:13px; font-family:inherit;}
.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--panel);}
table{width:100%; border-collapse:collapse; min-width:920px; font-size:13px;}
th{text-align:left; padding:12px 14px; color:var(--dim); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; border-bottom:1px solid var(--border); white-space:nowrap;}
td{padding:12px 14px; border-bottom:1px solid var(--border); white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--panel2); cursor:pointer;}
.mono{font-family:ui-monospace,monospace; color:var(--dim); font-size:12px;}

/* status pill colors */
.st-available{background:#28394C;color:#B9C9DA;}
.st-assigned{background:#2A3B57;color:#8FB4F0;}
.st-dispatched{background:#33325A;color:#B6A9F5;}
.st-at_pickup{background:#4A3A1E;color:#F0C878;}
.st-loaded{background:#4A3A1E;color:#F0C878;}
.st-in_transit{background:#3A2E12;color:var(--accent);}
.st-at_delivery{background:#1E3B33;color:#6FD3AE;}
.st-delivered{background:#1B3B27;color:var(--accent2);}
.st-documents_pending{background:#4A2A1E;color:#F09B78;}
.st-invoiced{background:#2A2E4A;color:#9AA6F0;}
.st-paid{background:#173A24;color:#5FE39A;}
.st-cancelled{background:#3B1E1E;color:var(--danger);}

/* ---------- MODAL ---------- */
.overlay{display:none; position:fixed; inset:0; background:rgba(6,10,15,.72); z-index:50; align-items:flex-start; justify-content:center; padding:30px 16px; overflow-y:auto;}
.overlay.open{display:flex;}
.modal{background:var(--panel); border:1px solid var(--border); border-radius:14px; width:100%; max-width:720px; padding:26px 28px 30px; margin-bottom:40px;}
.modal h2{margin:0 0 4px; font-size:22px;}
.modal .modal-sub{color:var(--dim); font-size:13px; margin-bottom:20px;}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px 14px;}
.form-grid .span2{grid-column:1/-1;}
.field label{display:block; font-size:12px; color:var(--dim); margin-bottom:5px; font-weight:600;}
.field input,.field select,.field textarea{width:100%; background:var(--panel2); border:1px solid var(--border); color:var(--text); padding:9px 11px; border-radius:8px; font-size:13.5px; font-family:inherit;}
.field textarea{resize:vertical; min-height:60px;}
.section-divider{grid-column:1/-1; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); border-top:1px solid var(--border); padding-top:14px; margin-top:2px;}
.modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:22px;}
.file-row{display:flex; align-items:center; gap:8px;}
.file-row input[type=file]{font-size:11px;}
.file-chip{font-size:11px; color:var(--accent2); background:#173A24; padding:3px 8px; border-radius:6px; white-space:nowrap;}
.close-x{position:absolute; top:20px; right:20px; background:none; border:none; color:var(--dim); font-size:20px; cursor:pointer;}
.modal-wrap{position:relative;}

/* driver/customer simple views */
.card-list{display:grid; gap:12px;}
.load-card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px;}
.load-card .lc-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
.load-card .lc-route{font-size:14px; font-weight:600; margin-bottom:2px;}
.load-card .lc-meta{font-size:12px; color:var(--dim); display:flex; gap:14px; flex-wrap:wrap; margin-top:8px;}
.locked-msg{color:var(--dim); font-size:14px; background:var(--panel); border:1px dashed var(--border); border-radius:var(--radius); padding:26px; text-align:center;}

/* ---------- MOBILE ---------- */
.hamburger{display:none;}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ } }
@media (max-width:880px){
  .kpi-grid{grid-template-columns:1fr 1fr;}
  .dash-cols{grid-template-columns:1fr;}
  .shell{flex-direction:column;}
  .sidebar{width:100%; height:auto; position:sticky; top:0; z-index:30; flex-direction:row; align-items:center; padding:12px 14px; overflow-x:auto;}
  .sidebar .logo{padding:0 12px 0 0;}
  .nav-item{white-space:nowrap;}
  .sidebar-foot{display:none;}
  .main{padding:18px 16px 50px;}
  .form-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login">
  <div class="login-card">
    <div class="login-logo"><div class="mark"></div><span>Drive Mode TMS</span></div>
    <div class="login-sub">DriveModeTMS.com — sign in to your account</div>

    <div class="field" style="margin-bottom:12px;"><label>Email</label><input id="loginEmail" type="email" placeholder="you@drivemodetms.com" onkeydown="if(event.key==='Enter')attemptLogin()"></div>
    <div class="field" style="margin-bottom:6px;"><label>Password</label><input id="loginPassword" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')attemptLogin()"></div>
    <div id="loginError" style="color:var(--danger);font-size:12.5px;min-height:16px;margin:2px 0 12px;"></div>
    <button class="btn" style="width:100%;" onclick="attemptLogin()">Sign In</button>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <div class="shell">
    <div class="sidebar">
      <div class="logo"><div class="mark"></div>Drive Mode</div>
      <div id="navItems"></div>
      <div class="sidebar-foot">
        <div class="who" id="whoName"></div>
        <div class="who-role" id="whoRole"></div>
        <button class="logout-btn" onclick="logout()">Sign out</button>
      </div>
    </div>
    <div class="main" id="main"></div>
  </div>
</div>

<!-- ================= LOAD MODAL ================= -->
<div class="overlay" id="loadOverlay">
  <div class="modal modal-wrap">
    <button class="close-x" onclick="closeModal()">✕</button>
    <h2 id="modalTitle">New Load</h2>
    <div class="modal-sub" id="modalSub">Enter load details, assign resources, and set status.</div>
    <div class="form-grid" id="formGrid"></div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="saveLoad()">Save Load</button>
    </div>
  </div>
</div>

<!-- ================= GENERIC ENTITY MODAL ================= -->
<div class="overlay" id="entityOverlay">
  <div class="modal modal-wrap">
    <button class="close-x" onclick="closeEntityModal()">✕</button>
    <h2 id="entityModalTitle">Edit</h2>
    <div class="modal-sub" id="entityModalSub"></div>
    <div class="form-grid" id="entityFormGrid"></div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeEntityModal()">Cancel</button>
      <button class="btn" onclick="saveEntityModal()">Save</button>
    </div>
  </div>
</div>

function loadDB(){
  const seed = seedData();
  let raw = localStorage.getItem(LS_KEY);
  if(!raw){ localStorage.setItem(LS_KEY, JSON.stringify(seed)); return seed; }
  let data;
  try{ data = JSON.parse(raw); }catch(e){ data = null; }
  if(!data){ localStorage.setItem(LS_KEY, JSON.stringify(seed)); return seed; }
  // migrate: backfill any top-level sections added by later app versions
  Object.keys(seed).forEach(k=>{ if(!(k in data)) data[k] = seed[k]; });
  // migrate: backfill new per-driver fields (classification, payType, payRate) for saves from older versions
  if(Array.isArray(data.drivers)){
    data.drivers.forEach(d=>{
      const seedMatch = seed.drivers.find(sd=>sd.id===d.id) || seed.drivers[0];
      if(d.classification===undefined) d.classification = seedMatch.classification;
      if(d.payType===undefined) d.payType = seedMatch.payType;
      if(d.payRate===undefined) d.payRate = seedMatch.payRate;
    });
  }
  localStorage.setItem(LS_KEY, JSON.stringify(data));
  return data;
}

}
function fillLogin(email, password){
  document.getElementById('loginEmail').value = email;
  document.getElementById('loginPassword').value = password;

}
function clearAllData(){
  if(confirm('This will delete all data and reset to fresh demo data. Continue?')){
    localStorage.removeItem('dmtms_data_v1');
    location.reload();
  }
}
function attemptLogin(){
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  if(!email || !password){ errEl.textContent = 'Enter your email and password.'; return; }

  // Check against DB users only
  const user = DB.users.find(u=>u.email.toLowerCase()===email && u.password===password && u.active);

  if(!user){ errEl.textContent = 'Incorrect email or password.'; return; }
  errEl.textContent = '';
  login(user);
}
function login(user){
  currentRole = user.role;
  currentUser = user;
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('whoName').textContent = user.name;
  document.getElementById('whoRole').textContent = user.role.replace('_',' / ');

  const landing = user.role==='driver' ? 'myloads' : user.role==='customer' ? 'customerloads' : user.role==='safety' ? 'drivers' : 'dashboard';
  navigate(landing);
}

/* ---------- HELPERS ---------- */
function fmtMoney(n){ return '$' + Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0}); }
function fmtDate(iso){ if(!iso) return '—'; const dt=new Date(iso); return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ' · ' + dt.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }
function fmtDateOnly(iso){ if(!iso) return '—'; return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function daysUntil(dateStr){ return Math.ceil((new Date(dateStr) - new Date('2026-09-27')) / 86400000); }
function driverName(id){ const d = DB.drivers.find(x=>x.id===id); return d? d.name : '— Unassigned'; }
function truckUnit(id){ const t = DB.trucks.find(x=>x.id===id); return t? t.unit : '—'; }
function trailerUnit(id){ const t = DB.trailers.find(x=>x.id===id); return t? t.unit : '—'; }
function custName(id){ const c = DB.customers.find(x=>x.id===id); return c? c.name : '—'; }

function renderDashboard(main){
  const loads = DB.loads;
  const total = loads.length;
  const delivered = loads.filter(l=>['delivered','documents_pending','invoiced','paid'].includes(l.status)).length;
  const active = loads.filter(l=>!['delivered','documents_pending','invoiced','paid','cancelled'].includes(l.status)).length;
  const revenue = loads.filter(l=>l.status!=='cancelled').reduce((s,l)=>s+l.rate+l.detention+l.layover+l.tonu,0);
  const expenses = Math.round(revenue*0.62); // modeled: fuel, driver pay, maintenance, tolls
  const outstanding = loads.filter(l=>l.status==='invoiced').reduce((s,l)=>s+l.rate,0);

  const driverAlerts = [];
  DB.drivers.forEach(d=>{
    const cdlD = daysUntil(d.cdlExp), medD = daysUntil(d.medExp);
    if(cdlD<=30) driverAlerts.push({sev:cdlD<=7?'bad':'warn', text:`${d.name} — CDL expires in ${cdlD} days`});
    if(medD<=30) driverAlerts.push({sev:medD<=7?'bad':'warn', text:`${d.name} — Medical card expires in ${medD} days`});
    if(d.mvr.startsWith('1')) driverAlerts.push({sev:'warn', text:`${d.name} — MVR flagged for review`});
  });
  const truckAlerts = [];
  DB.trucks.forEach(t=>{
    const insD = daysUntil(t.insExp), regD = daysUntil(t.regExp), inspD = daysUntil(t.nextInspection);
    if(insD<=30) truckAlerts.push({sev:insD<=7?'bad':'warn', text:`${t.unit} — Insurance expires in ${insD} days`});
    if(regD<=30) truckAlerts.push({sev:regD<=7?'bad':'warn', text:`${t.unit} — Registration expires in ${regD} days`});
    if(inspD<=14) truckAlerts.push({sev:inspD<=3?'bad':'warn', text:`${t.unit} — Inspection due in ${inspD} days`});
  });

  const upcoming = [];
  loads.forEach(l=>{
    [['Pickup',l.pickupAt,l.pickupLoc],['Delivery',l.deliveryAt,l.deliveryLoc]].forEach(([kind,at,loc])=>{
      const dd = daysUntil(at);
      if(dd>=-1 && dd<=5) upcoming.push({load:l.id, kind, at, loc, dd});
    });
  });
  upcoming.sort((a,b)=> new Date(a.at)-new Date(b.at));

  main.innerHTML = `
  <div class="topbar"><div><h1>Dashboard</h1><div class="desc">Drive Mode Logistics — company-wide overview</div></div>
    <button class="btn" onclick="navigate('dispatch')">+ New Load</button></div>
  <div class="kpi-grid">
    <div class="kpi"><div class="lbl">Total Loads</div><div class="stat-num">${total}</div><div class="sub">All statuses</div></div>
    <div class="kpi accent"><div class="lbl">Active Loads</div><div class="stat-num">${active}</div><div class="sub">In progress right now</div></div>
    <div class="kpi good"><div class="lbl">Delivered</div><div class="stat-num">${delivered}</div><div class="sub">Completed runs</div></div>
    <div class="kpi good"><div class="lbl">Revenue</div><div class="stat-num">${fmtMoney(revenue)}</div><div class="sub">Booked, all loads</div></div>
    <div class="kpi bad"><div class="lbl">Expenses</div><div class="stat-num">${fmtMoney(expenses)}</div><div class="sub">Fuel, pay, maintenance</div></div>
    <div class="kpi warn"><div class="lbl">Outstanding Invoices</div><div class="stat-num">${fmtMoney(outstanding)}</div><div class="sub">${loads.filter(l=>l.status==='invoiced').length} invoice(s) open</div></div>
    <div class="kpi ${driverAlerts.length?'bad':''}"><div class="lbl">Driver Alerts</div><div class="stat-num">${driverAlerts.length}</div><div class="sub">CDL, medical, MVR</div></div>
    <div class="kpi ${truckAlerts.length?'bad':''}"><div class="lbl">Truck Alerts</div><div class="stat-num">${truckAlerts.length}</div><div class="sub">Insurance, registration, inspection</div></div>
  </div>
  <div class="dash-cols">
    <div class="panel">
      <h3>Upcoming Pickups &amp; Deliveries</h3>
      ${upcoming.length? upcoming.map(u=>`<div class="row-item"><div><div class="t1">${u.load} — ${u.kind}</div><div class="t2">${u.loc}</div></div><div style="text-align:right"><div class="t1">${fmtDate(u.at)}</div><div class="t2">${u.dd<0?'overdue':u.dd===0?'today':'in '+u.dd+' days'}</div></div></div>`).join('') : '<div class="empty">Nothing scheduled in the next 5 days.</div>'}
    </div>
    <div class="panel">
      <h3>Alerts</h3>
      ${[...driverAlerts,...truckAlerts].length ? [...driverAlerts,...truckAlerts].map(a=>`<div class="alert-item"><div class="alert-dot ${a.sev}"></div><div>${a.text}</div></div>`).join('') : '<div class="empty">No open alerts.</div>'}
    </div>
  </div>`;
}

function calcMiles(){
  const pickup = document.getElementById('f_pickupLoc').value.trim();
  const delivery = document.getElementById('f_deliveryLoc').value.trim();
  const milesEl = document.getElementById('f_miles');

  if(!pickup || !delivery || pickup===delivery) { milesEl.value=''; return; }

  // Look up distance (try both directions)
  const key1 = pickup + '|' + delivery;
  const key2 = delivery + '|' + pickup;
  const miles = distanceMatrix[key1] || distanceMatrix[key2];

  if(miles) { milesEl.value = miles; }
}
function closeModal(){ document.getElementById('loadOverlay').classList.remove('open'); editingLoadId=null; }

function saveLoad(){
  const g = id => document.getElementById(id);
  const docFile = id => g(id).files[0] ? g(id).files[0].name : null;
  const data = {
    pickupLoc: g('f_pickupLoc').value || 'TBD',
    deliveryLoc: g('f_deliveryLoc').value || 'TBD',
    pickupAt: g('f_pickupAt').value ? new Date(g('f_pickupAt').value).toISOString() : new Date().toISOString(),
    deliveryAt: g('f_deliveryAt').value ? new Date(g('f_deliveryAt').value).toISOString() : new Date().toISOString(),
    shipperId: g('f_shipperId').value || null,
    brokerId: g('f_brokerId').value || null,
    rate: parseFloat(g('f_rate').value)||0,
    miles: parseInt(g('f_miles').value)||0,
    hours: parseFloat(g('f_hours').value)||0,
    equipment: g('f_equipment').value,
    status: g('f_status').value,
    truckId: g('f_truckId').value || null,
    trailerId: g('f_trailerId').value || null,
    driverId: g('f_driverId').value || null,
    detention: parseFloat(g('f_detention').value)||0,
    layover: parseFloat(g('f_layover').value)||0,
    tonu: parseFloat(g('f_tonu').value)||0,
    notes: g('f_notes').value,
  };
  if(editingLoadId){
    const existing = DB.loads.find(x=>x.id===editingLoadId);
    Object.assign(existing, data);
    existing.docs.ratecon = docFile('f_doc_ratecon') || existing.docs.ratecon;
    existing.docs.bol = docFile('f_doc_bol') || existing.docs.bol;
    existing.docs.pod = docFile('f_doc_pod') || existing.docs.pod;
  } else {
    const num = 1000 + DB.loads.length + 1;
    data.id = 'L-' + num;
    data.docs = { ratecon: docFile('f_doc_ratecon'), bol: docFile('f_doc_bol'), pod: docFile('f_doc_pod') };
    DB.loads.push(data);
  }
  saveDB();
  closeModal();
  renderDispatch(document.getElementById('main'));
}

function deleteLoad(loadId){
  const l = DB.loads.find(x=>x.id===loadId);
  if(!l) return;
  if(confirm(`Delete load ${l.id}?\n\nRoute: ${l.pickupLoc} → ${l.deliveryLoc}\nRate: ${fmtMoney(l.rate)}\n\nThis action cannot be undone.`)){
    DB.loads = DB.loads.filter(x=>x.id!==loadId);
    saveDB();
    renderDispatch(document.getElementById('main'));
    alert(`✓ Load ${l.id} deleted.`);
  }
}

function openLBConfigModal(board){

function postToBoard(loadId){
  const l = DB.loads.find(x=>x.id===loadId);
  const boards = ['DAT', 'Truckstop.com', 'Brokerages'];
  const boardChoices = boards.map(b=>{
    const config = DB.loadBoardConfig.find(c=>c.board===b);
    const status = config?.connected ? '✓ Connected' : 'Not configured';
    return {value:b, label:`${config?.name || b} — ${status}`};
  });

  openEntityModal('Post Load to Boards', `Select which boards to post ${l.id} to`, [
    {id:'boards',label:'Post to:',type:'select',options:boardChoices,span2:true},
  ], {boards:'DAT'}, ()=>{
    const board = document.getElementById('ent_boards').value;
    const prefix = board==='DAT'?'DAT':board==='Truckstop.com'?'TS':'BR';
    DB.loadBoardPostings.push({id:'lbp'+Date.now(), loadId, board, externalRef:prefix+'-'+Math.floor(Math.random()*90000+10000)+'-'+loadId.slice(2), postedRate:l.rate, status:'posted', postedAt:new Date().toISOString()});
    saveDB(); renderLoadBoard(document.getElementById('main'));
    alert(`✅ Load posted to ${board}!`);
  });
}
function bookPosting(id){
  const p = DB.loadBoardPostings.find(x=>x.id===id); p.status='booked'; p.bookedAt=new Date().toISOString();
  const l = DB.loads.find(x=>x.id===p.loadId); if(l && l.status==='available') l.status='assigned';
  saveDB(); renderLoadBoard(document.getElementById('main'));
}
function removePosting(id){
  const p = DB.loadBoardPostings.find(x=>x.id===id); p.status='removed';
  saveDB(); renderLoadBoard(document.getElementById('main'));
}
function importListing(id){
  const x = DB.loadBoardListings.find(l=>l.id===id);
  const num = 1000 + DB.loads.length + 1; const newId = 'L-'+num;
  let broker = DB.customers.find(c=>c.name===x.broker);
  if(!broker){ broker = {id:'cus'+Date.now(), name:x.broker, type:'broker', contact:'', email:'', phone:'', terms:'Quick Pay'}; DB.customers.push(broker); }
  DB.loads.push({id:newId, shipperId:null, brokerId:broker.id, pickupLoc:x.origin, deliveryLoc:x.destination, pickupAt:x.pickupDate, deliveryAt:x.pickupDate, rate:x.rate, miles:x.miles, equipment:x.equipment, truckId:null, trailerId:null, driverId:null, status:'available', detention:0, layover:0, tonu:0, notes:'Imported from '+x.board+' ('+x.externalRef+')', docs:{}});
  x.imported = true;
  saveDB(); renderLoadBoard(document.getElementById('main'));
}

let entitySaveCallback = null;
function openEntityModal(title, sub, fields, values, onSave){
  document.getElementById('entityModalTitle').textContent = title;
  document.getElementById('entityModalSub').textContent = sub || '';
  document.getElementById('entityFormGrid').innerHTML = fields.map(f=>{
    const val = (values && values[f.id]!=null) ? values[f.id] : '';
    if(f.type==='select') return `<div class="field ${f.span2?'span2':''}"><label>${f.label}</label><select id="ent_${f.id}" ${f.readonly?'disabled':''}>${f.options.map(o=>`<option value="${o.value}" ${String(o.value)===String(val)?'selected':''}>${o.label}</option>`).join('')}</select></div>`;
    if(f.type==='textarea') return `<div class="field span2"><label>${f.label}</label><textarea id="ent_${f.id}" ${f.readonly?'readonly':''}>${val}</textarea></div>`;
    return `<div class="field ${f.span2?'span2':''}"><label>${f.label}</label><input type="${f.type||'text'}" id="ent_${f.id}" value="${val}" ${f.readonly?'readonly':''}></div>`;
  }).join('');
  entitySaveCallback = onSave;
  document.getElementById('entityOverlay').classList.add('open');
}
function closeEntityModal(){ document.getElementById('entityOverlay').classList.remove('open'); entitySaveCallback=null; }
function saveEntityModal(){ if(entitySaveCallback) entitySaveCallback(); closeEntityModal(); }
function expPill(dateStr){
  const dd = daysUntil(dateStr);
  const color = dd<=7 ? ['#3B1E1E','#E5555C'] : dd<=30 ? ['#4A3A1E','#F0C878'] : ['#1B3B27','#5FE39A'];
  return pillColor(color[0], color[1], fmtDateOnly(dateStr) + (dd<=30 ? ` (${dd}d)` : ''));
}

function deleteTruck(truckId){
  const t = DB.trucks.find(x=>x.id===truckId);
  if(!t) return;
  if(!confirm(`Delete truck: ${t.unit}?\n\nThis action cannot be undone.`)) return;

  const idx = DB.trucks.findIndex(x=>x.id===truckId);
  if(idx > -1){
    DB.trucks.splice(idx, 1);
    saveDB();
    alert(`✓ Truck "${t.unit}" deleted successfully`);
    renderFleet(document.getElementById('main'));
  }
}

}

function updatePayRateLabel(){
  const payTypeEl = document.getElementById('ent_payType');
  const payRateLabel = document.querySelector('label[for="ent_payRate"]') || document.querySelector('[data-label-for="payRate"]');
  if(!payTypeEl || !payRateLabel) return;
  const payType = payTypeEl.value;
  let label = 'Pay Rate';
  if(payType==='per_mile') label = 'Pay Rate ($/mile)';
  else if(payType==='per_hour') label = 'Pay Rate ($/hour)';
  else if(payType==='percentage') label = 'Pay Rate (%)';
  else if(payType==='salary') label = 'Pay Rate ($/week)';
  payRateLabel.textContent = label;
}

function updateDriverPaymentInfo(){
  const driverSelect = document.getElementById('f_driverId');
  const driverId = driverSelect?.value;
  const infoDiv = document.getElementById('driverPaymentInfo');

  if(!driverId || !infoDiv) return;

  const driver = DB.drivers.find(d=>d.id===driverId);
  if(!driver) { infoDiv.style.display='none'; return; }

  const miles = parseFloat(document.getElementById('f_miles')?.value || 0);
  const hours = parseFloat(document.getElementById('f_hours')?.value || 0);

  let paymentInfo = `<b>${driver.name}</b> ${driver.employeeId ? '('+driver.employeeId+')' : ''}<br>`;

  if(driver.classification === 'w2_employee'){
    paymentInfo += `<span style="color:var(--accent2);">W-2 Employee</span><br>`;
    if(driver.payType === 'per_mile'){
      paymentInfo += `Rate: $${driver.payRate}/mile<br>`;
      if(miles > 0) paymentInfo += `Expected: $${(miles * driver.payRate).toFixed(2)}`;
    } else if(driver.payType === 'per_hour'){
      paymentInfo += `Rate: $${driver.payRate}/hour<br>`;
      if(hours > 0) paymentInfo += `Expected: $${(hours * driver.payRate).toFixed(2)}`;
    } else if(driver.payType === 'percentage'){
      paymentInfo += `Rate: ${driver.payRate}% of load<br>`;
      const rate = parseFloat(document.getElementById('f_rate')?.value || 0);
      if(rate > 0) paymentInfo += `Expected: $${(rate * driver.payRate / 100).toFixed(2)}`;
    }
  } else {
    paymentInfo += `<span style="color:#8FB4F0;">Owner-Operator (1099)</span><br>Rates: See settlement`;
  }

  infoDiv.innerHTML = paymentInfo;
  infoDiv.style.display = 'block';
}

function getNextEmployeeId(){
  const existingIds = DB.drivers.filter(d=>d.classification==='w2_employee').map(d=>d.employeeId).filter(id=>id && id.startsWith('DML'));
  const numbers = existingIds.map(id=>parseInt(id.replace('DML',''))).filter(n=>!isNaN(n));
  const nextNum = (numbers.length ? Math.max(...numbers) : 0) + 1;
  return 'DML' + String(nextNum).padStart(2, '0');
}

function createInvoiceFromLoad(loadId){
  const load = DB.loads.find(l=>l.id===loadId);
  if(!load) return;

  const total = load.rate + (load.detention||0) + (load.layover||0) + (load.tonu||0);
  const cust = DB.customers.find(c=>c.id===load.customerId) || {name:'Unknown'};

  if(!confirm(`Create invoice for load ${loadId}?\nCustomer: ${cust.name}\nAmount: ${fmtMoney(total)}`)) return;

  // Update load status to invoiced
  load.status = 'invoiced';
  load.invoicedAt = new Date().toISOString();
  load.invoiceNumber = 'INV-' + Date.now();

  saveDB();
  alert(`✓ Invoice ${load.invoiceNumber} created for ${cust.name}`);
  window.accountingTab = 'invoices';
  renderAccounting(document.getElementById('main'));
}

function markInvoicePaid(loadId){
  const load = DB.loads.find(l=>l.id===loadId);
  if(!load) return;

  if(!confirm(`Mark invoice as paid for load ${loadId}?`)) return;

  load.status = 'paid';
  load.paidAt = new Date().toISOString();

  saveDB();
  alert('✓ Invoice marked as paid');
  window.accountingTab = 'invoices';
  renderAccounting(document.getElementById('main'));
}

function generatePayrollRun(){
  const w2Drivers = DB.drivers.filter(d=>d.classification==='w2_employee');
  if(w2Drivers.length === 0) { alert('No W-2 employees found'); return; }

  const overlay = document.createElement('div');
  overlay.className = 'overlay open';
  overlay.innerHTML = `
  <div class="modal modal-wrap" style="max-width:600px;">
    <button class="close-x" onclick="this.closest('.overlay').remove()">✕</button>
    <h2>Generate Payroll Run</h2>
    <div class="modal-sub">Create payroll records for W-2 employees</div>
    <div class="form-grid" id="payrollForm">
      <div class="field"><label>Pay Period Start Date</label><input type="date" id="startDate" required></div>
      <div class="field"><label>Pay Period End Date</label><input type="date" id="endDate" required></div>
      <div class="field span2" style="margin-bottom:12px;"><label style="display:flex;align-items:center;gap:10px;"><input type="checkbox" id="selectAll"> <strong>Select All Employees</strong></label></div>
      <div class="field span2" style="border:1px solid var(--border);border-radius:6px;padding:10px;max-height:200px;overflow-y:auto;margin-bottom:12px;">
        ${w2Drivers.map(d=>`<label style="display:flex;align-items:center;gap:8px;margin-bottom:8px;"><input type="checkbox" class="emp-checkbox" value="${d.id}" data-name="${d.name}"> ${d.name} (${d.employeeId})</label>`).join('')}
      </div>
      <div class="field span2"><label>Hours for All Employees</label><input type="number" id="hoursInput" placeholder="Hours" min="0" step="0.5" required></div>
    </div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="this.closest('.overlay').remove()">Cancel</button>
      <button class="btn" onclick="submitPayrollRun()">Create Payroll Run</button>
    </div>
  </div>
  `;
  document.body.appendChild(overlay);

  setTimeout(()=>{
    document.getElementById('selectAll').addEventListener('change', function(){
      document.querySelectorAll('.emp-checkbox').forEach(cb=>cb.checked=this.checked);
    });
  }, 0);
}

function submitPayrollRun(){
  const startDate = document.getElementById('startDate').value;
  const endDate = document.getElementById('endDate').value;
  const hours = parseFloat(document.getElementById('hoursInput').value);
  const selected = Array.from(document.querySelectorAll('.emp-checkbox:checked')).map(cb=>cb.value);

  if(!startDate || !endDate) { alert('Please enter both dates'); return; }
  if(selected.length === 0) { alert('Please select at least one employee'); return; }
  if(isNaN(hours) || hours < 0) { alert('Please enter valid hours'); return; }

  selected.forEach(driverId=>{
    const driver = DB.drivers.find(d=>d.id===driverId);
    if(!driver) return;

    const rate = driver.employmentDetails?.hourlyRate || 0;
    const grossWages = hours * rate;
    const taxes = grossWages * 0.15; // 15% tax estimate
    const deductions = driver.employmentDetails?.deductions || 0;
    const netPay = grossWages - taxes - deductions;

    const newPayroll = {
      id: 'w2p_'+Date.now()+'_'+Math.random().toString(36).substr(2,9),
      driverId: driverId,
      payPeriod: { startDate, endDate },
      hoursWorked: hours,
      hourlyRate: rate,
      grossWages: parseFloat(grossWages.toFixed(2)),
      taxes: parseFloat(taxes.toFixed(2)),
      deductions: parseFloat(deductions.toFixed(2)),
      netPay: parseFloat(netPay.toFixed(2)),
      status: 'pending',
      createdBy: currentUser.id,
      createdAt: new Date().toISOString()
    };

    DB.w2Payrolls.push(newPayroll);
  });

  saveDB();
  document.querySelector('.modal').remove();
  alert('Payroll run created for '+selected.length+' employee(s)');
  renderW2Payroll(document.getElementById('main'));
}

function approveW2Payroll(payrollId){
  const p = DB.w2Payrolls.find(x=>x.id===payrollId);
  p.status='approved'; p.approvedBy=currentUser.name; p.approvedAt=new Date().toISOString();
  saveDB(); window.accountingTab='payroll'; renderAccounting(document.getElementById('main'));
  alert('✓ Payroll approved and ready to pay');
}

function markW2PayrollPaid(payrollId){
  const p = DB.w2Payrolls.find(x=>x.id===payrollId);
  p.status='paid'; p.paidAt=new Date().toISOString();
  saveDB(); window.accountingTab='payroll'; renderAccounting(document.getElementById('main'));
  alert('✓ Payroll marked as paid (ACH transfer)');
}

function deletePayroll(payrollId){
  if(!confirm('Are you sure you want to delete this payroll? This action cannot be undone.')) return;
  const idx = DB.w2Payrolls.findIndex(p=>p.id===payrollId);
  if(idx > -1) {
    DB.w2Payrolls.splice(idx, 1);
    saveDB();
    alert('Payroll deleted successfully');
    window.accountingTab = 'payroll';
    renderAccounting(document.getElementById('main'));
  }
}

function updateSettlementLoads(){
  const startDate = document.getElementById('settlementStart').value;
  const endDate = document.getElementById('settlementEnd').value;
  const ooId = document.getElementById('settlementOO').value;

  if(!startDate || !endDate || !ooId) {
    document.getElementById('settlementLoadsList').innerHTML = '<div style="color:var(--dim);font-size:12px;">Select all fields to see loads</div>';
    document.getElementById('settlementRevenue').value = '';
    return;
  }

  const oo = DB.ownerOperators.find(o=>o.id===ooId);
  const matchedLoads = DB.loads.filter(l=> l.driverId === oo.driverId && l.status === 'delivered' && new Date(l.deliveryAt) >= new Date(startDate) && new Date(l.deliveryAt) <= new Date(endDate));

  if(matchedLoads.length === 0) {
    document.getElementById('settlementLoadsList').innerHTML = '<div style="color:var(--dim);font-size:12px;">No completed loads in this period</div>';
    document.getElementById('settlementRevenue').value = '0.00';
    return;
  }

  const totalRevenue = matchedLoads.reduce((sum, l)=> sum + l.rate + l.detention + l.layover + l.tonu, 0);
  document.getElementById('settlementRevenue').value = totalRevenue.toFixed(2);

  document.getElementById('settlementLoadsList').innerHTML = matchedLoads.map(l=> `<div style="padding:6px;border-bottom:1px solid var(--border);font-size:12px;"><strong>${l.id}</strong> ${l.pickupLoc}→${l.deliveryLoc} <span style="color:var(--accent);">$${(l.rate + l.detention + l.layover + l.tonu).toFixed(2)}</span></div>`).join('');

  document.getElementById('settlementRevenue').dataset.loadIds = JSON.stringify(matchedLoads.map(l=>l.id));
}

function submitSettlement(){
  const startDate = document.getElementById('settlementStart').value;
  const endDate = document.getElementById('settlementEnd').value;
  const ooId = document.getElementById('settlementOO').value;
  const revenue = parseFloat(document.getElementById('settlementRevenue').value);
  const loadIdsJson = document.getElementById('settlementRevenue').dataset.loadIds;
  const loadIds = loadIdsJson ? JSON.parse(loadIdsJson) : [];

  if(!startDate || !endDate || !ooId || isNaN(revenue)) {
    alert('Please fill in all fields');
    return;
  }

  if(loadIds.length === 0) {
    alert('No completed loads found in the selected period');
    return;
  }

  const oo = DB.ownerOperators.find(o=>o.id===ooId);
  if(!oo) { alert('Owner-Operator not found'); return; }

  // Calculate deductions based on owner-operator agreement
  const dispatchFee = revenue * (oo.dispatchPercentage / 100);
  const totalDeductions = oo.insuranceDeduction + dispatchFee + oo.eldMonthlyFee + oo.trailerRentalMonthly + oo.maintenancePool;
  const ownerShare = revenue * (oo.ownerShare / 100);
  const netSettlement = ownerShare - (totalDeductions * (oo.ownerShare / 100));

  const newSettlement = {
    id: 'settlement_' + Date.now(),
    ownerOperatorId: ooId,
    settlementPeriod: { startDate, endDate },
    loadIds: loadIds,
    grossRevenue: parseFloat(revenue.toFixed(2)),
    creditsBreakdown: { loadRevenue: revenue, accessorials: 0, bonuses: 0, reimbursements: 0 },
    deductions: {
      insurance: oo.insuranceDeduction,
      dispatchFee: parseFloat(dispatchFee.toFixed(2)),
      eldFee: oo.eldMonthlyFee,
      trailerRental: oo.trailerRentalMonthly,
      maintenance: oo.maintenancePool,
      fuelAdvance: 0,
      otherDeductions: 0,
      totalDeductions: parseFloat(totalDeductions.toFixed(2))
    },
    ownershipSplit: { percentage: oo.ownerShare, ownerShare: parseFloat(ownerShare.toFixed(2)), companyShare: parseFloat((revenue - ownerShare).toFixed(2)) },
    netSettlement: parseFloat(netSettlement.toFixed(2)),
    status: 'pending',
    createdBy: currentUser.id,
    createdAt: new Date().toISOString()
  };

  DB.ownerOperatorSettlements.push(newSettlement);
  saveDB();
  document.querySelector('.modal').remove();
  alert('Settlement created successfully');
  window.accountingTab = 'settlements';
  renderAccounting(document.getElementById('main'));
}

function renderDocuments(main){
  // Categorize document types
  const docCategories = {
    POD: { label:'Proof of Delivery', color:'#2E5C3E', icon:'✓' },
    BOL: { label:'Bill of Lading', color:'#3D4A6B', icon:'📋' },
    INSURANCE: { label:'Insurance & Compliance', color:'#5C3D2E', icon:'🛡️' }
  };

  // Function to determine doc category
  function getDocCategory(type){
    const t = type.toLowerCase();
    if(t.includes('pod') || t.includes('proof') || t.includes('delivery') || t.includes('signature')) return 'POD';
    if(t.includes('bol') || t.includes('bill of lading') || t.includes('shipping')) return 'BOL';
    if(t.includes('insurance') || t.includes('cdl') || t.includes('medical') || t.includes('registration')) return 'INSURANCE';
    return 'BOL'; // default
  }

  const docs = {POD:[], BOL:[], INSURANCE:[]};

  // Collect uploaded documents
  if(DB.documents){
    DB.documents.forEach(d=>{
      const cat = getDocCategory(d.category);
      docs[cat].push({id:d.id, type:d.type, related:d.related, file:d.content.substring(0,50)+'...', docClass:'Upload', uploadedAt:d.uploadedAt});
    });
  }

  // Collect load documents
  DB.loads.forEach(l=>{
    Object.entries(l.docs).forEach(([type,file])=>{
      if(file){
        const cat = getDocCategory(type);
        docs[cat].push({type, related:l.id, file, docClass:'Load'});
      }
    });
  });

  // Collect driver documents
  DB.drivers.forEach(d=>{
    docs.INSURANCE.push({type:'CDL', related:d.name, file:d.cdl||'On file', docClass:'Driver'});
    docs.INSURANCE.push({type:'Medical Card', related:d.name, file:'expires '+fmtDateOnly(d.medExp), docClass:'Driver'});
  });

  // Collect truck documents
  DB.trucks.forEach(t=>{
    docs.BOL.push({type:'Registration', related:t.unit, file:'expires '+fmtDateOnly(t.regExp), docClass:'Fleet'});
    docs.INSURANCE.push({type:'Insurance', related:t.unit, file:'expires '+fmtDateOnly(t.insExp), docClass:'Fleet'});
  });

  // Build HTML with categorized sections
  let html = `<div class="topbar"><div><button class="btn secondary" style="padding:6px 12px;font-size:14px;margin-right:12px;" onclick="navigate('dashboard')">← Back to Dashboard</button><h1>Document Center</h1><div class="desc">All company documents organized by category</div></div>
  ${currentUser && currentUser.role === 'owner_admin' ? `<div style="display:flex;gap:8px;"><button class="btn" onclick="openUploadDocModal()">+ Upload Document</button><button class="btn secondary" style="color:var(--danger);" onclick="deleteAllDocuments()">Delete All</button></div>` : ''}</div>`;

  Object.entries(docCategories).forEach(([key, cat])=>{
    const items = docs[key]||[];
    html += `
    <div class="panel">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
        <span style="font-size:20px;">${cat.icon}</span>
        <h3 style="margin:0;color:${cat.color};">${cat.label}</h3>
        <span style="margin-left:auto;background:var(--panel2);padding:4px 12px;border-radius:16px;font-size:12px;font-weight:600;">${items.length} doc(s)</span>
      </div>
      ${items.length?
        `<div class="table-wrap" style="border:none;"><table><thead><tr><th>Document Type</th><th>Related To</th><th style="font-size:12px;color:var(--dim);">Class</th><th>File / Detail</th><th>Uploaded</th>${currentUser && currentUser.role === 'owner_admin' ? '<th></th>' : ''}</tr></thead>
        <tbody>${items.map(d=>`<tr><td><b>${d.type}</b></td><td>${d.related}</td><td style="font-size:12px;color:var(--dim);">${d.docClass}</td><td class="mono" style="font-size:12px;"><button class="btn small secondary" style="padding:2px 6px;font-size:11px;" onclick="editDocument('${d.id||''}', '${d.type}')">View/Edit</button></td><td style="font-size:12px;color:var(--dim);">${d.uploadedAt ? fmtDateOnly(d.uploadedAt) : '-'}</td>${currentUser && currentUser.role === 'owner_admin' ? `<td style="text-align:center;"><button class="btn small secondary" style="color:var(--danger);padding:4px 8px;font-size:11px;" onclick="deleteDocument('${d.docClass}','${d.related}','${d.type}','${d.id||''}')">Delete</button></td>` : ''}</tr>`).join('')}</tbody></table></div>`
        :`<div style="padding:24px;text-align:center;color:var(--dim);background:var(--panel2);border-radius:8px;font-size:14px;">No documents yet</div>`}
    </div>`;
  });

  main.innerHTML = html;
}

function deleteDocument(docClass, related, docType, docId){
  if(!confirm(`Delete ${docType} for ${related}?\n\nThis action cannot be undone.`)) return;

  if(docId && DB.documents){
    const idx = DB.documents.findIndex(d=>d.id===docId);
    if(idx > -1) DB.documents.splice(idx, 1);
  } else if(docClass === 'Load'){
    const load = DB.loads.find(l => l.id === related);
    if(load){
      const docKey = docType.toLowerCase().replace(/\s+/g, '_');
      if(docKey === 'rate_confirmation') delete load.docs.ratecon;
      else if(docKey === 'bol') delete load.docs.bol;
      else if(docKey === 'pod') delete load.docs.pod;
    }
  }

  saveDB();
  renderDocuments(document.getElementById('main'));
  alert('✓ Document deleted');
}

function deleteAllDocuments(){
  if(!confirm('Delete ALL documents?\n\nThis action cannot be undone!')) return;

  // Clear uploaded documents
  if(DB.documents) DB.documents = [];

  // Clear load documents
  DB.loads.forEach(l=>{ l.docs = {bol:null, pod:null}; });

  saveDB();
  renderDocuments(document.getElementById('main'));
  alert('✓ All documents deleted');
}

  if(!u) return;
  if(!confirm(`Delete user: ${u.name} (${u.email})?\n\nThis action cannot be undone.`)) return;

  const idx = DB.users.findIndex(x=>x.id===userId);
  if(idx > -1){
    DB.users.splice(idx, 1);
    saveDB();
    alert(`✓ User "${u.name}" deleted successfully`);
    renderUsers(document.getElementById('main'));
  }
}

renderLogin();
</script>
</body>
</html>
