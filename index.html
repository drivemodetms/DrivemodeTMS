function submitUploadDocument(){
  const docType = document.getElementById('docType').value;
  const docTitle = document.getElementById('docTitle').value;
  const docRelated = document.getElementById('docRelated').value;
  const docContent = document.getElementById('docContent').value;
  const docExpires = document.getElementById('docExpires').value;

  if(!docType || !docTitle || !docRelated || !docContent){
    alert('Please fill in all required fields');
    return;
  }

  if(!DB.documents) DB.documents = [];

  const newDoc = {
    id: 'doc_' + Date.now(),
    type: docTitle,
    category: docType,
    related: docRelated,
    content: docContent,
    expiresAt: docExpires || null,
    uploadedAt: new Date().toISOString(),
    uploadedBy: currentUser ? currentUser.name : 'System'
  };

  DB.documents.push(newDoc);
  saveDB();
  closeDynOverlay();
  alert('✓ Document uploaded successfully');
  renderDocuments(document.getElementById('main'));
}

function editDocument(docId, docType){
  if(!docId){ alert('Cannot edit system documents. Upload a new version instead.'); return; }

  const doc = DB.documents.find(d=>d.id===docId);
  if(!doc){ alert('Document not found'); return; }

  const overlay = document.createElement('div');
  overlay.className = 'overlay open dyn-overlay';
  overlay.innerHTML = `
  <div class="modal modal-wrap" style="max-width:500px;">
    <button class="close-x" onclick="this.closest('.overlay').remove()">✕</button>
    <h2>Edit Document</h2>
    <div class="form-grid">
      <div class="field span2"><label>Document Title</label><input type="text" id="editDocTitle" value="${esc(doc.type)}" required></div>
      <div class="field span2"><label>Related To</label><input type="text" id="editDocRelated" value="${esc(doc.related)}" required></div>
      <div class="field span2"><label>Content / Notes</label><textarea id="editDocContent" style="background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px;min-height:100px;color:var(--text);font-family:monospace;font-size:12px;" required>${esc(doc.content)}</textarea></div>
      <div class="field span2"><label>Expiration Date</label><input type="date" id="editDocExpires" value="${doc.expiresAt || ''}" required></div>
    </div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="this.closest('.overlay').remove()">Cancel</button>
      <button class="btn" onclick="submitEditDocument('${docId}')">Save Changes</button>
    </div>
  </div>
  `;
  document.body.appendChild(overlay);
}

function submitEditDocument(docId){
  const doc = DB.documents.find(d=>d.id===docId);
  if(!doc) return;

  doc.type = document.getElementById('editDocTitle').value;
  doc.related = document.getElementById('editDocRelated').value;
  doc.content = document.getElementById('editDocContent').value;
  doc.expiresAt = document.getElementById('editDocExpires').value || null;
  doc.modifiedAt = new Date().toISOString();
  doc.modifiedBy = currentUser ? currentUser.name : 'System';

  saveDB();
  closeDynOverlay();
  alert('✓ Document updated successfully');
  renderDocuments(document.getElementById('main'));
}

    card.innerHTML = authShell('First-time setup — create the Owner / Admin account', `${msg}
      <p class="auth-p">No accounts exist yet. The account you create here becomes the <b>Owner / Admin</b>. After that, only you can add people, from the Users page.</p>
      <div class="field" style="margin-bottom:12px;"><label>Your Name</label><input id="setupName" autocomplete="name"></div>
      <div class="field" style="margin-bottom:12px;"><label>Email</label><input id="setupEmail" type="email" autocomplete="username"></div>
      <div class="field" style="margin-bottom:12px;"><label>Password (min 8 characters)</label><input id="setupPw" type="password" autocomplete="new-password"></div>
      <div class="field" style="margin-bottom:6px;"><label>Confirm Password</label><input id="setupPw2" type="password" autocomplete="new-password" ${enter('submitSetup')}></div>
      <div id="authErr" class="auth-err"></div>
      <button class="btn" style="width:100%;" onclick="submitSetup()">Create Admin Account</button>`);
  }
  else if(view==='confirm'){
    card.innerHTML = authShell('Confirm your email', `
      <div class="auth-msg good">We sent a confirmation link to <b>${esc(authState.email)}</b>.</div>
      <p class="auth-p">Open it to activate your account, then sign in here. Check spam if you don’t see it.</p>
      <div class="auth-links"><a href="#" onclick="event.preventDefault(); renderAuth('signin',{email:authState.email})">Go to sign in</a></div>`);
  }
  else if(view==='error'){
    card.innerHTML = authShell('Something went wrong', `
      <div class="auth-msg bad">${esc(authState.message||'Unknown error')}</div>
      ${authState.retry ? `<button class="btn" style="width:100%;" onclick="location.reload()">Try Again</button>
      <div class="auth-links"><a href="#" onclick="event.preventDefault(); logout()">Sign out</a></div>` : ''}`);
  }
  const first = card.querySelector('input'); if(first) setTimeout(()=>first.focus(), 0);
}
async function submitForgot(){
  const email = (document.getElementById('forgotEmail').value||'').trim().toLowerCase();
  const err = document.getElementById('authErr');
  if(!EMAIL_RE.test(email)){ err.textContent = 'Enter a valid email address.'; return; }
  authBusy(true);
  const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: appUrl()});
  if(error && /rate limit|too many|security purposes/i.test(error.message)){ authBusy(false); err.textContent = 'Too many reset emails were requested. Wait a few minutes and try again.'; return; }
  if(error && /fetch|network/i.test(error.message)){ authBusy(false); err.textContent = friendlyError(error); return; }
  if(error && /sending|smtp|unexpected|not accepted/i.test(error.message)){ authBusy(false); err.textContent = 'Password reset emails aren’t available right now. Ask your Drive Mode administrator to set a new password for you.'; return; }
  renderAuth('forgot', {email, sent:true});   // same answer whether or not the account exists
}
async function submitNewPassword(){
  const pw = document.getElementById('newPw').value, pw2 = document.getElementById('newPw2').value;
  const err = document.getElementById('authErr');
  if(pw.length < 8){ err.textContent = 'Password must be at least 8 characters.'; return; }
  if(pw !== pw2){ err.textContent = 'Passwords do not match.'; return; }
  authBusy(true);
  const {error} = await sb.auth.updateUser({password: pw});
  if(error){ authBusy(false); err.textContent = authErrorText(error); return; }
  await enterApp();
}
async function submitSetup(){
  const g = id => document.getElementById(id).value;
  const name = g('setupName').trim(), email = g('setupEmail').trim().toLowerCase(), pw = g('setupPw'), pw2 = g('setupPw2');
  const err = document.getElementById('authErr');
  if(!name){ err.textContent = 'Enter your name.'; return; }
  if(!EMAIL_RE.test(email)){ err.textContent = 'Enter a valid email address.'; return; }
  if(pw.length < 8){ err.textContent = 'Password must be at least 8 characters.'; return; }
  if(pw !== pw2){ err.textContent = 'Passwords do not match.'; return; }
  authBusy(true);
  // create the Owner / Admin account directly (no confirmation email needed)
  const {data, error} = await sb.functions.invoke('admin-users', {body:{action:'bootstrap', name, email, password: pw}});
  if(error || (data && data.error)){
    let msg = (data && data.error) || (error && error.message);
    try{ const j = await error.context.json(); if(j && j.error) msg = j.error; }catch(_){}
    authBusy(false); err.textContent = msg || 'Could not create the account.'; return;
  }
  const {error:se} = await sb.auth.signInWithPassword({email, password: pw});
  if(se){ authBusy(false); err.textContent = authErrorText(se); return; }
  await enterApp();
}

/* ---------- IMPORT data saved in this browser by the old version ---------- */
function legacyData(){
  try{ const raw = localStorage.getItem(LEGACY_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function legacyCounts(data){
  return COLLECTIONS.filter(c=>c!=='loadBoardConfig' && Array.isArray(data[c]) && data[c].length).map(c=>[c, data[c].length]);
}
const COLLECTION_LABEL = {loads:'loads', drivers:'drivers', trucks:'trucks', trailers:'trailers', customers:'customers', expenses:'expenses', factoringCompanies:'factoring companies', factoringSubmissions:'factoring submissions',
  loadBoardPostings:'load board postings', loadBoardListings:'load board listings', ownerOperators:'owner-operator agreements', ownerOperatorSettlements:'old owner-operator settlements', driverSettlements:'driver settlements', w2Payrolls:'paystubs', documents:'documents'};
function offerLegacyImport(manual){
  const data = legacyData();
  let dismissed = false; try{ dismissed = localStorage.getItem(LEGACY_KEY+'_import')==='done'; }catch(e){}
  if(!data || (!manual && dismissed)) { if(manual) alert('No data from the old version was found in this browser.'); return; }
  const counts = legacyCounts(data);
  if(!counts.length){ if(manual) alert('No data from the old version was found in this browser.'); return; }
  const hasData = COLLECTIONS.some(c=>c!=='loadBoardConfig' && DB[c].length);
  if(!manual && hasData) return;
  const overlay = document.createElement('div');
  overlay.className = 'overlay open dyn-overlay';
  overlay.innerHTML = `<div class="modal" style="max-width:520px;">
    <button class="close-x" onclick="closeDynOverlay()">✕</button>
    <h2>Bring Over Your Data?</h2>
    <div class="modal-sub">This browser still has data saved by the old version of Drive Mode TMS. Import it into your Supabase database so everyone on your team can see it.</div>
    <div class="panel" style="margin:14px 0;padding:12px 16px;">${counts.map(([c,n])=>`<div class="row-item"><div class="t1">${COLLECTION_LABEL[c]||c}</div><div>${n}</div></div>`).join('')}</div>
    <p class="auth-p" style="font-size:12.5px;">Includes any sample data that came with the demo (e.g. Marcus Reyes, loads L-1001–L-1007) — you can delete what you don’t need afterward. Records that already exist are skipped. User logins are not copied: invite people from the Users page.</p>
    <div class="modal-actions">
      <button class="btn secondary" onclick="dismissLegacyImport()">Don’t Ask Again</button>
      <button class="btn secondary" onclick="closeDynOverlay()">Not Now</button>
      <button class="btn" onclick="runLegacyImport()">Import</button>
    </div></div>`;
  document.body.appendChild(overlay);
}
function dismissLegacyImport(){ try{ localStorage.setItem(LEGACY_KEY+'_import','done'); }catch(e){} closeDynOverlay(); }
function migrateLegacy(data){
  (data.ownerOperators||[]).forEach(o=>{ if(o.driverId && !(data.drivers||[]).some(d=>d.id===o.driverId)) o.driverId = null; });
  (data.drivers||[]).forEach(d=>{
    if(typeof d.percentageRate==='number' && d.percentageRate>0 && d.percentageRate<1) d.percentageRate = d.payType==='percentage' ? d.payRate : Math.round(d.percentageRate*100);
  });
  return data;
}
async function runLegacyImport(){
  const data = migrateLegacy(legacyData() || {});
  let added = 0;
  COLLECTIONS.forEach(c=>{
    if(!Array.isArray(data[c])) return;
    const have = new Set(DB[c].map(x=>recIdOf(c,x)));
    data[c].forEach(item=>{ const id = recIdOf(c,item); if(id && !have.has(id)){ DB[c].push(item); have.add(id); added++; } });
  });
  closeDynOverlay();
  clearTimeout(saveTimer);
  if(await flushSave()){
    try{ localStorage.setItem(LEGACY_KEY+'_import','done'); }catch(e){}
    alert(`✓ Imported ${added} record${added===1?'':'s'} into Supabase.`);
    navigate(lastNavKey||'dashboard');
  }
}

/* ---------- USER MANAGEMENT (Supabase accounts) ---------- */
function userStatusPill(u){
  if(!u.active) return pillColor('#3B1E1E','#E5555C','Deactivated');
  if(!u.confirmedAt) return pillColor('#4A3A1E','#F0C878','Invitation sent');
  return pillColor('#173A24','#5FE39A','Active');
}
function userLinkText(u){
  if(u.role==='driver') return u.driverId ? (DB.drivers.find(d=>d.id===u.driverId)?.name ? esc(DB.drivers.find(d=>d.id===u.driverId).name) : '<span style="color:var(--warn)">Driver removed</span>') : '<span style="color:var(--warn)">Not linked</span>';
  if(u.role==='customer') return u.customerId ? (DB.customers.find(c=>c.id===u.customerId) ? esc(DB.customers.find(c=>c.id===u.customerId).name) : '<span style="color:var(--warn)">Customer removed</span>') : '<span style="color:var(--warn)">Not linked</span>';
  return '<span style="color:var(--dim)">—</span>';
}
function renderUsers(main){
  const legacy = legacyData(); let imported = false; try{ imported = localStorage.getItem(LEGACY_KEY+'_import')==='done'; }catch(e){}
  const showImport = legacy && !imported && legacyCounts(legacy).length;
  main.innerHTML = `<div class="topbar"><div><button class="btn secondary" style="padding:6px 12px;font-size:14px;margin-right:12px;" onclick="navigate('dashboard')">← Back to Dashboard</button><h1>User Management</h1><div class="desc">Invite people and manage roles and access</div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn secondary" onclick="refreshUsers()">↻ Refresh</button><button class="btn" onclick="openCreateUserModal()">+ Add User</button></div></div>
  <div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Linked To</th><th>Status</th><th>Last Sign-in</th><th></th></tr></thead>
  <tbody>${DB.users.map(u=>`<tr style="cursor:default;"><td>${esc(u.name)}${u.id===currentUser?.id?' <span style="color:var(--dim);font-size:11px;">(you)</span>':''}</td><td>${esc(u.email)}</td>
    <td><span class="pill" style="background:var(--panel2);color:var(--text)">${ROLE_NAMES[u.role]||esc(u.role)}</span></td>
    <td>${userLinkText(u)}</td>
    <td>${userStatusPill(u)}</td>
    <td>${u.lastSignInAt ? fmtDateOnly(u.lastSignInAt) : '<span style="color:var(--dim)">Never</span>'}</td>
    <td style="display:flex;gap:6px;flex-wrap:wrap;"><button class="btn small secondary" onclick="openEditUserModal('${u.id}')">Edit</button>${u.id!==currentUser?.id && u.active && !u.confirmedAt ? `<button class="btn small secondary" title="Resend the invitation email" onclick="resendInvite('${u.id}', this)">Resend</button>` : ''}${u.id !== currentUser?.id ? `<button class="btn small secondary" style="color:var(--danger);padding:4px 8px;font-size:11px;" onclick="deleteUser('${u.id}')">Delete</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="7" class="empty">No users yet.</td></tr>'}</tbody></table></div>
  <p class="auth-p" style="margin-top:14px;font-size:12.5px;">If someone forgets their password, click <b>Edit</b> on their row and set a new one. People you emailed an invitation show as “Invitation sent” until they open it.</p>`;
}
async function refreshUsers(){
  try{ await loadUsers(); renderUsers(document.getElementById('main')); }catch(e){ alert(friendlyError(e)); }
}
const ROLE_OPTIONS_LONG = [
  {value:'dispatcher',label:'Dispatcher — Manage loads & assignments'},
  {value:'driver',label:'Driver — Driver portal access'},
  {value:'customer',label:'Customer — Customer portal access'},
  {value:'accounting',label:'Accounting — Settlements & factoring'},
  {value:'safety',label:'Safety — Compliance & alerts'},
  {value:'owner_admin',label:'Owner / Admin — Full access'},
];
function linkFields(){
  return [
    {id:'driverId',label:'Linked Driver (for Driver role)',type:'select',options:[{value:'',label:'— None —'},...DB.drivers.map(d=>({value:d.id,label:d.name}))]},
    {id:'customerId',label:'Linked Customer (for Customer role)',type:'select',options:[{value:'',label:'— None —'},...DB.customers.map(c=>({value:c.id,label:c.name}))]},
  ];
}
function openCreateUserModal(){
  openEntityModal('Add User', 'Create a login for a team member, driver or customer.', [
    {id:'name',label:'Full Name',span2:true},
    {id:'email',label:'Email Address (their username)',span2:true},
    {id:'role',label:'Role',type:'select',span2:true,options:ROLE_OPTIONS_LONG},
    ...linkFields(),
    {id:'method',label:'How will they get their password?',type:'select',span2:true,options:[{value:'password',label:'I’ll set a password now and give it to them (no email needed)'},{value:'invite',label:'Email them an invitation to set their own password'}]},
    {id:'password',label:'Password (min 8 characters)',type:'password'},
    {id:'password2',label:'Confirm Password',type:'password'},
  ], {role:'dispatcher', method:'password'}, async ()=>{
    const g = k => document.getElementById('ent_'+k).value;
    const name = g('name').trim(), email = g('email').trim().toLowerCase(), role = g('role'), method = g('method');
    if(!name || !email){ alert('Enter a name and email.'); return false; }
    if(!EMAIL_RE.test(email)){ alert('Enter a valid email address, like name@company.com'); return false; }
    if(DB.users.some(u=>u.email.toLowerCase()===email)){ alert('An account with that email already exists.'); return false; }
    if(role==='driver' && !g('driverId') && !confirm('No driver record is linked, so this person will see an empty driver portal until you link one under Edit.\n\nSend the invitation anyway?')) return false;
    if(role==='customer' && !g('customerId') && !confirm('No customer record is linked, so this person will see an empty customer portal until you link one under Edit.\n\nSend the invitation anyway?')) return false;
    if(method==='password'){
      const pw = g('password');
      if(pw.length < 8){ alert('Password must be at least 8 characters.'); return false; }
      if(pw !== g('password2')){ alert('Passwords do not match.'); return false; }
      try{ await callAdmin('create', {name, email, role, password:pw, driverId:g('driverId')||null, customerId:g('customerId')||null}); }
      catch(e){ alert('✗ Account not created.\n\n' + e.message); return false; }
      await refreshUsers();
      alert(`✓ Account created for ${name}.\n\nThey sign in at ${appUrl()} with:\nEmail: ${email}\nPassword: the one you just set\n\nShare the password with them privately (text or phone call).`);
      return;
    }
    try{
      await callAdmin('invite', {name, email, role, driverId:g('driverId')||null, customerId:g('customerId')||null});
    }catch(e){ alert('✗ Invitation not sent.\n\n' + e.message); return false; }
    await refreshUsers();
    alert(`✉ Invitation sent to ${email}.\n\nThey’ll get an email with a link to set their password and sign in. Ask them to check spam if it doesn’t arrive.`);
  });
  document.getElementById('ent_method').onchange = toggleNewUserMethod; toggleNewUserMethod();
}

function toggleNewUserMethod(){
  const m = document.getElementById('ent_method'); if(!m) return;
  const show = m.value==='password';
  ['ent_password','ent_password2'].forEach(id=>{ const f = document.getElementById(id); if(f) f.closest('.field').style.display = show ? '' : 'none'; });
}
function openEditUserModal(id){
  const u = DB.users.find(x=>x.id===id);
  if(!u) return;
  const self = u.id===currentUser?.id;
  openEntityModal(`Edit User — ${u.name}`, u.email, [
    {id:'name',label:'Full Name',span2:true},
    {id:'role',label:'Role',type:'select',readonly:self,options:ROLE_OPTIONS_LONG.map(o=>({value:o.value,label:ROLE_NAMES[o.value]}))},
    {id:'active',label:'Status',type:'select',readonly:self,options:[{value:'true',label:'Active'},{value:'false',label:'Deactivated — can’t sign in'}]},
    {id:'newPassword',label:'Set New Password (optional — leave blank to keep)',type:'password',span2:true},
    ...linkFields(),
  ], {name:u.name, role:u.role, active:String(u.active), driverId:u.driverId||'', customerId:u.customerId||''}, async ()=>{
    const g = k => document.getElementById('ent_'+k).value;
    const np = g('newPassword');
    if(np && np.length < 8){ alert('New password must be at least 8 characters.'); return false; }
    const patch = {id:u.id, name:g('name').trim(), driverId:g('driverId'), customerId:g('customerId')};
    if(!self){ patch.role = g('role'); patch.active = g('active')==='true'; }
    if(np) patch.password = np;
    try{ await callAdmin('update', patch); }catch(e){ alert('✗ Not saved.\n\n' + e.message); return false; }
    if(self){ currentUser.name = patch.name; document.getElementById('whoName').textContent = patch.name; }
    await refreshUsers();
    if(np) alert(`✓ Password updated for ${u.email}. Share it with them securely (text or phone).`);
  });
}
async function resendInvite(id, btn){
  const u = DB.users.find(x=>x.id===id); if(!u) return;
  if(btn){ btn.disabled = true; btn.textContent = 'Sending…'; }
  try{ await callAdmin('resend', {id}); alert(`✉ Invitation re-sent to ${u.email}.`); }
  catch(e){ alert('✗ Not sent.\n\n' + e.message); }
  refreshUsers();
}
async function deleteUser(userId){
  const u = DB.users.find(x=>x.id===userId);
  if(!u) return;
  if(!confirm(`Delete user: ${u.name} (${u.email})?\n\nThey will no longer be able to sign in. Their loads, settlements and other records are kept.\n\nThis action cannot be undone.`)) return;
  try{ await callAdmin('delete', {id:userId}); }catch(e){ alert('✗ Not deleted.\n\n' + e.message); return; }
  await refreshUsers();
  alert(`✓ User "${u.name}" deleted`);
}

boot();
</script>
