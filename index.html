<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drive Mode TMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1720; --panel:#16212E; --panel2:#1C2A3A; --border:#28394C;
  --text:#E9EEF4; --dim:#8FA3B8; --accent:#FF6A1A; --accent2:#3EA36E;
  --warn:#F0A93B; --danger:#E5555C; --radius:10px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{
  margin:0; height:100%; background:var(--bg); color:var(--text);
  font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.logo,.stat-num{font-family:'Big Shoulders Display',system-ui,sans-serif;}
::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

/* ---------- LOGIN ---------- */
#login{min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px;
  background:radial-gradient(1200px 600px at 15% -10%, #1a2b3d 0%, var(--bg) 60%);}
.login-card{width:100%; max-width:460px; background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:40px 36px;}
.login-logo{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
.login-logo .mark{width:14px;height:34px;background:var(--accent);border-radius:3px; transform:skewX(-12deg);}
.login-logo span{font-size:30px; font-weight:800; letter-spacing:0.5px;}
.login-sub{color:var(--dim); font-size:14px; margin-bottom:28px;}
.auth-err{color:var(--danger);font-size:12.5px;min-height:16px;margin:2px 0 12px;}
.auth-links{display:flex;justify-content:space-between;gap:12px;margin-top:16px;font-size:13px;}
.auth-links a{color:var(--accent);text-decoration:none;} .auth-links a:hover{text-decoration:underline;}
.auth-p{color:var(--dim);font-size:13.5px;line-height:1.5;margin:0 0 16px;} .auth-p b{color:var(--text);}
.auth-msg{font-size:12.5px;line-height:1.5;border-radius:8px;padding:10px 12px;margin-bottom:14px;border:1px solid var(--border);}
.auth-msg.demo{background:#2A2013;border-color:#4A3220;color:#F0C878;} .auth-msg.bad{background:#3B1E1E;border-color:#5a2a2a;color:#F09B9B;} .auth-msg.good{background:#173A24;border-color:#24563a;color:#5FE39A;}
.code-input{letter-spacing:8px;font-size:20px !important;text-align:center;font-family:ui-monospace,monospace !important;}
.login-foot{margin-top:26px; font-size:12px; color:var(--dim); line-height:1.6;}

/* ---------- APP SHELL ---------- */
#app{display:none; min-height:100dvh;}
.shell{display:flex; min-height:100dvh;}
.sidebar{width:230px; flex:none; background:var(--panel); border-right:1px solid var(--border);
  padding:22px 14px; display:flex; flex-direction:column; gap:4px; position:sticky; top:0; height:100dvh; overflow-y:auto;}
.sidebar .logo{display:flex; align-items:center; gap:8px; padding:0 8px 20px; font-size:20px; font-weight:800;}
.sidebar .logo .mark{width:10px;height:22px;background:var(--accent);border-radius:2px; transform:skewX(-12deg);}
.nav-item{padding:11px 12px; border-radius:8px; color:var(--dim); font-size:14px; font-weight:500; cursor:pointer; display:flex; align-items:center; gap:10px; border:1px solid transparent;}
.nav-item:hover{background:var(--panel2); color:var(--text);}
.nav-item.active{background:#2A2013; color:var(--accent); border-color:#4A3220;}
.nav-item.locked{opacity:.4; cursor:default;}
.nav-item.locked:hover{background:none; color:var(--dim);}
.sidebar-foot{margin-top:auto; padding:12px 8px 0; border-top:1px solid var(--border);}
.who{font-size:13px; font-weight:600;}
.who-role{font-size:11px; color:var(--dim); text-transform:capitalize; margin-bottom:10px;}
.logout-btn{width:100%; padding:9px; background:transparent; border:1px solid var(--border); color:var(--dim); border-radius:8px; cursor:pointer; font-size:13px;}
.logout-btn:hover{color:var(--text); border-color:var(--accent);}

.main{flex:1; min-width:0; padding:26px 30px 60px;}
.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:12px;}
.topbar h1{font-size:28px; margin:0; font-weight:700;}
.topbar .desc{color:var(--dim); font-size:13px; margin-top:2px;}
.btn{background:var(--accent); color:#1a0d02; border:none; padding:10px 18px; border-radius:8px; font-weight:700; font-size:13.5px; cursor:pointer; font-family:'Inter',sans-serif;}
.btn:hover{filter:brightness(1.08);}
.btn.secondary{background:var(--panel2); color:var(--text); border:1px solid var(--border);}
.btn.small{padding:6px 12px; font-size:12.5px;}

/* ---------- DASHBOARD ---------- */
.kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px;}
.kpi{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px;}
.kpi .lbl{font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.04em;}
.stat-num{font-size:30px; font-weight:700; margin:6px 0 2px;}
.kpi .sub{font-size:12px; color:var(--dim);}
.kpi.accent .stat-num{color:var(--accent);}
.kpi.good .stat-num{color:var(--accent2);}
.kpi.warn .stat-num{color:var(--warn);}
.kpi.bad .stat-num{color:var(--danger);}

.dash-cols{display:grid; grid-template-columns:1.3fr 1fr; gap:16px;}
.panel{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px;}
.panel h3{margin:0 0 14px; font-size:16px; font-weight:700;}
.row-item{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); font-size:13.5px;}
.row-item:last-child{border-bottom:none;}
.row-item .t1{font-weight:600;}
.row-item .t2{color:var(--dim); font-size:12px;}
.pill{padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; white-space:nowrap;}
.alert-item{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); font-size:13px;}
.alert-item:last-child{border-bottom:none;}
.alert-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none;}
.alert-dot.bad{background:var(--danger);} .alert-dot.warn{background:var(--warn);}
.empty{color:var(--dim); font-size:13px; padding:8px 0;}

/* ---------- DISPATCH TABLE ---------- */
.filters{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
.filters select,.filters input{background:var(--panel2); border:1px solid var(--border); color:var(--text); padding:8px 10px; border-radius:8px; font-size:13px; font-family:inherit;}
.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--panel);}
table{width:100%; border-collapse:collapse; min-width:920px; font-size:13px;}
th{text-align:left; padding:12px 14px; color:var(--dim); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; border-bottom:1px solid var(--border); white-space:nowrap;}
td{padding:12px 14px; border-bottom:1px solid var(--border); white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--panel2); cursor:pointer;}
.mono{font-family:ui-monospace,monospace; color:var(--dim); font-size:12px;}

/* status pill colors */
.st-available{background:#28394C;color:#B9C9DA;}
.st-assigned{background:#2A3B57;color:#8FB4F0;}
.st-dispatched{background:#33325A;color:#B6A9F5;}
.st-at_pickup{background:#4A3A1E;color:#F0C878;}
.st-loaded{background:#4A3A1E;color:#F0C878;}
.st-in_transit{background:#3A2E12;color:var(--accent);}
.st-at_delivery{background:#1E3B33;color:#6FD3AE;}
.st-delivered{background:#1B3B27;color:var(--accent2);}
.st-documents_pending{background:#4A2A1E;color:#F09B78;}
.st-invoiced{background:#2A2E4A;color:#9AA6F0;}
.st-paid{background:#173A24;color:#5FE39A;}
.st-cancelled{background:#3B1E1E;color:var(--danger);}

/* ---------- MODAL ---------- */
.overlay{display:none; position:fixed; inset:0; background:rgba(6,10,15,.72); z-index:50; align-items:flex-start; justify-content:center; padding:30px 16px; overflow-y:auto;}
.overlay.open{display:flex;}
.modal{background:var(--panel); border:1px solid var(--border); border-radius:14px; width:100%; max-width:720px; padding:26px 28px 30px; margin-bottom:40px;}
.modal h2{margin:0 0 4px; font-size:22px;}
.modal .modal-sub{color:var(--dim); font-size:13px; margin-bottom:20px;}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px 14px;}
.form-grid .span2{grid-column:1/-1;}
.field label{display:block; font-size:12px; color:var(--dim); margin-bottom:5px; font-weight:600;}
.field input,.field select,.field textarea{width:100%; background:var(--panel2); border:1px solid var(--border); color:var(--text); padding:9px 11px; border-radius:8px; font-size:13.5px; font-family:inherit;}
.field textarea{resize:vertical; min-height:60px;}
.section-divider{grid-column:1/-1; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); border-top:1px solid var(--border); padding-top:14px; margin-top:2px;}
.modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:22px;}
.file-row{display:flex; align-items:center; gap:8px;}
.file-row input[type=file]{font-size:11px;}
.file-chip{font-size:11px; color:var(--accent2); background:#173A24; padding:3px 8px; border-radius:6px; white-space:nowrap;}
.close-x{position:absolute; top:20px; right:20px; background:none; border:none; color:var(--dim); font-size:20px; cursor:pointer;}
.modal-wrap{position:relative;}

/* driver/customer simple views */
.card-list{display:grid; gap:12px;}
.load-card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px;}
.load-card .lc-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
.load-card .lc-route{font-size:14px; font-weight:600; margin-bottom:2px;}
.load-card .lc-meta{font-size:12px; color:var(--dim); display:flex; gap:14px; flex-wrap:wrap; margin-top:8px;}
.locked-msg{color:var(--dim); font-size:14px; background:var(--panel); border:1px dashed var(--border); border-radius:var(--radius); padding:26px; text-align:center;}

/* ---------- MOBILE ---------- */
.hamburger{display:none;}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ } }
.stl-line{display:flex;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--border);font-size:13px;cursor:pointer;}
.stl-line:last-child{border-bottom:none;}
.stl-line > span{flex:1;}
.stl-line .t2{color:var(--dim);font-size:12px;}
@media print{
  :root{--bg:#fff;--panel:#fff;--panel2:#f5f5f5;--border:#ccc;--text:#111;--dim:#555;--accent:#111;--accent2:#111;--danger:#111;}
  .sidebar,.no-print,.overlay{display:none !important;}
  .main{padding:0;} .panel{break-inside:avoid;}
  .pill{border:1px solid #999;}
}
@media (max-width:880px){
  .kpi-grid{grid-template-columns:1fr 1fr !important;}
  .dash-cols{grid-template-columns:1fr !important;}
  .row-item{flex-wrap:wrap; gap:8px;}
  .stat-num{font-size:24px; overflow-wrap:anywhere;}
  .topbar > div{min-width:0;}
  .shell{flex-direction:column;}
  .sidebar{width:100%; height:auto; position:sticky; top:0; z-index:30; flex-direction:row; align-items:center; padding:12px 14px; overflow-x:auto;}
  .sidebar .logo{padding:0 12px 0 0;}
  .nav-item{white-space:nowrap; flex:none;}
  #navItems{display:flex; gap:4px;}
  .sidebar .logo{flex:none;}
  .mobile-signout{display:block !important;}
  .sidebar-foot{display:none;}
  .main{padding:18px 16px 50px;}
  .form-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login">
  <div class="login-card" id="authCard"></div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <div class="shell">
    <div class="sidebar">
      <div class="logo"><div class="mark"></div>Drive Mode</div>
      <div id="navItems"></div>
      <button class="logout-btn mobile-signout" style="display:none;width:auto;flex:none;white-space:nowrap;margin-left:6px;" onclick="logout()">Sign out</button>
      <div class="sidebar-foot">
        <div class="who" id="whoName"></div>
        <div class="who-role" id="whoRole"></div>
        <button class="logout-btn" onclick="logout()">Sign out</button>
      </div>
    </div>
    <div class="main" id="main"></div>
  </div>
</div>

<!-- ================= LOAD MODAL ================= -->
<div class="overlay" id="loadOverlay">
  <div class="modal modal-wrap">
    <button class="close-x" onclick="closeModal()">✕</button>
    <h2 id="modalTitle">New Load</h2>
    <div class="modal-sub" id="modalSub">Enter load details, assign resources, and set status.</div>
    <div class="form-grid" id="formGrid"></div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="saveLoad()">Save Load</button>
    </div>
  </div>
</div>

<!-- ================= GENERIC ENTITY MODAL ================= -->
<div class="overlay" id="entityOverlay">
  <div class="modal modal-wrap">
    <button class="close-x" onclick="closeEntityModal()">✕</button>
    <h2 id="entityModalTitle">Edit</h2>
    <div class="modal-sub" id="entityModalSub"></div>
    <div class="form-grid" id="entityFormGrid"></div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeEntityModal()">Cancel</button>
      <button class="btn" onclick="saveEntityModal()">Save</button>
    </div>
  </div>
</div>

function loadDB(){
  const seed = seedData();
  let raw = localStorage.getItem(LS_KEY);
  if(!raw){ localStorage.setItem(LS_KEY, JSON.stringify(seed)); return seed; }
  let data;
  try{ data = JSON.parse(raw); }catch(e){ data = null; }
  if(!data){ localStorage.setItem(LS_KEY, JSON.stringify(seed)); return seed; }
  // migrate: backfill any top-level sections added by later app versions
  Object.keys(seed).forEach(k=>{ if(!(k in data)) data[k] = seed[k]; });
  // migrate: backfill new per-driver fields (classification, payType, payRate) for saves from older versions
  if(Array.isArray(data.drivers)){
    data.drivers.forEach(d=>{
      const seedMatch = seed.drivers.find(sd=>sd.id===d.id) || seed.drivers[0];
      if(d.classification===undefined) d.classification = seedMatch.classification;
      if(d.payType===undefined) d.payType = seedMatch.payType;
      if(d.payRate===undefined) d.payRate = seedMatch.payRate;
    });
  }
  // migrate: strip stray spaces saved in emails/passwords by older versions
  (data.users||[]).forEach(u=>{ if(typeof u.email==='string') u.email = u.email.trim().toLowerCase(); if(typeof u.password==='string') u.password = u.password.trim(); });
  // migrate: email verification removed — clear leftover flags/codes
  (data.users||[]).forEach(u=>{ ['emailVerified','emailVerifiedAt','verifyCode','verifyExpires','verifyTries'].forEach(k=>delete u[k]); });
  // migrate: link demo portal users to their records
  (data.users||[]).forEach(u=>{
    const su = seed.users.find(x=>x.id===u.id && x.email===u.email);
    if(su && su.driverId && u.driverId===undefined) u.driverId = su.driverId;
    if(su && su.customerId && u.customerId===undefined) u.customerId = su.customerId;
  });
  // migrate: drop owner-operator links to drivers that don't exist
  (data.ownerOperators||[]).forEach(o=>{ if(o.driverId && !(data.drivers||[]).some(d=>d.id===o.driverId)) o.driverId = null; });
  // migrate: percentage rates stored as fractions (e.g. 0.08) -> whole percent
  (data.drivers||[]).forEach(d=>{
    if(typeof d.percentageRate==='number' && d.percentageRate>0 && d.percentageRate<1){
      d.percentageRate = d.payType==='percentage' ? d.payRate : Math.round(d.percentageRate*100);
    }
  });
  localStorage.setItem(LS_KEY, JSON.stringify(data));
  return data;
}

function renderLogin(){

function attemptLogin(){
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const password = document.getElementById('loginPassword').value.trim();
  const errEl = document.getElementById('loginError');
  if(!email || !password){ errEl.textContent = 'Enter your email and password.'; return; }

  // Check against DB users only
  const account = DB.users.find(u=>String(u.email||'').trim().toLowerCase()===email);
  if(!account){ errEl.innerHTML = 'No account with that email in this browser.<br><span style="color:var(--dim)">Accounts are saved in the browser where they were created.</span>'; return; }
  if(String(account.password||'').trim()!==password){ errEl.textContent = 'Incorrect password.'; return; }
  if(!account.active){ errEl.textContent = 'This account is deactivated. Ask an admin to reactivate it.'; return; }
  errEl.textContent = '';
  login(account);
}
function login(user){
  currentRole = user.role;
  currentUser = user;
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('whoName').textContent = user.name;
  document.getElementById('whoRole').textContent = user.role.replace('_',' / ');

  const landing = user.role==='driver' ? 'myloads' : user.role==='customer' ? 'customerloads' : user.role==='safety' ? 'drivers' : 'dashboard';
  navigate(landing);
}
function logout(){

}

/* ---------- HELPERS ---------- */
function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function closeDynOverlay(){ document.querySelectorAll('.dyn-overlay').forEach(o=>o.remove()); }
function nextLoadId(){
  const nums = DB.loads.filter(l=>/^L-\d+$/.test(l.id)).map(l=>parseInt(l.id.slice(2),10));
  return 'L-' + ((nums.length ? Math.max(...nums) : 1000) + 1);
}
function myDriverId(){
  if(currentUser?.driverId) return currentUser.driverId;
  const byEmail = DB.drivers.find(d=>d.email && d.email.toLowerCase()===String(currentUser?.email||'').toLowerCase());
  if(byEmail) return byEmail.id;
  const byName = DB.drivers.find(d=>d.name===currentUser?.name);
  return byName ? byName.id : null;
}
function myCustomerId(){ return currentUser?.customerId || null; }
function noLinkMsg(kind){ return `<div class="locked-msg">Your account isn't linked to a ${kind} record yet.<br>Ask an admin to link it under Users → Edit.</div>`; }
function fmtMoney(n){ return '$' + Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0}); }
function fmtDate(iso){ if(!iso) return '—'; const dt=new Date(iso); return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ' · ' + dt.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }
function fmtDateOnly(iso){ const t = parseDay(iso); if(!t) return '—'; return t.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function parseDay(v){ if(!v) return null; const t = /^\d{4}-\d{2}-\d{2}$/.test(v) ? new Date(v+'T00:00:00') : new Date(v); return isNaN(t) ? null : t; }
function daysUntil(dateStr){
  const t = parseDay(dateStr); if(!t) return Infinity;
  const a = new Date(t); a.setHours(0,0,0,0); const b = new Date(); b.setHours(0,0,0,0);
  return Math.round((a - b) / 86400000);
}
function expText(dd){ return dd<0 ? `expired ${-dd} day${dd===-1?'':'s'} ago` : dd===0 ? 'expires today' : `expires in ${dd} day${dd===1?'':'s'}`; }
function dueText(dd){ return dd<0 ? `overdue by ${-dd} day${dd===-1?'':'s'}` : dd===0 ? 'due today' : `due in ${dd} day${dd===1?'':'s'}`; }
function driverName(id){ const d = DB.drivers.find(x=>x.id===id); return d? esc(d.name) : '— Unassigned'; }
function truckUnit(id){ const t = DB.trucks.find(x=>x.id===id); return t? t.unit : '—'; }
function trailerUnit(id){ const t = DB.trailers.find(x=>x.id===id); return t? t.unit : '—'; }
function custName(id){ const c = DB.customers.find(x=>x.id===id); return c? esc(c.name) : '—'; }

function renderDashboard(main){
  const loads = DB.loads;
  const total = loads.length;
  const delivered = loads.filter(l=>['delivered','documents_pending','invoiced','paid'].includes(l.status)).length;
  const active = loads.filter(l=>!['delivered','documents_pending','invoiced','paid','cancelled'].includes(l.status)).length;
  const revenue = loads.filter(l=>l.status!=='cancelled').reduce((s,l)=>s+l.rate+l.detention+l.layover+l.tonu,0);
  const expenses = (DB.expenses||[]).reduce((s,e)=>s+(Number(e.amount)||0),0);
  const outstanding = loads.filter(l=>l.status==='invoiced').reduce((s,l)=>s+l.rate,0);

  const driverAlerts = [];
  DB.drivers.forEach(d=>{
    const cdlD = daysUntil(d.cdlExp), medD = daysUntil(d.medExp);
    if(cdlD<=30) driverAlerts.push({sev:cdlD<=7?'bad':'warn', text:`${esc(d.name)} — CDL ${expText(cdlD)}`});
    if(medD<=30) driverAlerts.push({sev:medD<=7?'bad':'warn', text:`${esc(d.name)} — Medical card ${expText(medD)}`});
    if(/^\s*\d+\s+violation|review/i.test(d.mvr||'')) driverAlerts.push({sev:'warn', text:`${esc(d.name)} — MVR flagged for review`});
  });
  const truckAlerts = [];
  DB.trucks.forEach(t=>{
    const insD = daysUntil(t.insExp), regD = daysUntil(t.regExp), inspD = daysUntil(t.nextInspection);
    if(insD<=30) truckAlerts.push({sev:insD<=7?'bad':'warn', text:`${esc(t.unit)} — Insurance ${expText(insD)}`});
    if(regD<=30) truckAlerts.push({sev:regD<=7?'bad':'warn', text:`${esc(t.unit)} — Registration ${expText(regD)}`});
    if(inspD<=14) truckAlerts.push({sev:inspD<=3?'bad':'warn', text:`${esc(t.unit)} — Inspection ${dueText(inspD)}`});
  });

  DB.trailers.forEach(t=>{
    const insD = daysUntil(t.insExp), regD = daysUntil(t.regExp);
    if(insD<=30) truckAlerts.push({sev:insD<=7?'bad':'warn', text:`Trailer ${esc(t.unit)} — Insurance ${expText(insD)}`});
    if(regD<=30) truckAlerts.push({sev:regD<=7?'bad':'warn', text:`Trailer ${esc(t.unit)} — Registration ${expText(regD)}`});
  });
  const upcoming = [];
  loads.forEach(l=>{
    [['Pickup',l.pickupAt,l.pickupLoc],['Delivery',l.deliveryAt,l.deliveryLoc]].forEach(([kind,at,loc])=>{
      const dd = daysUntil(at);
      if(dd>=-1 && dd<=5) upcoming.push({load:l.id, kind, at, loc, dd});
    });
  });
  upcoming.sort((a,b)=> new Date(a.at)-new Date(b.at));

  main.innerHTML = `
  <div class="topbar"><div><h1>Dashboard</h1><div class="desc">Drive Mode Logistics — company-wide overview</div></div>
    <button class="btn" onclick="navigate('dispatch')">+ New Load</button></div>
  <div class="kpi-grid">
    <div class="kpi"><div class="lbl">Total Loads</div><div class="stat-num">${total}</div><div class="sub">All statuses</div></div>
    <div class="kpi accent"><div class="lbl">Active Loads</div><div class="stat-num">${active}</div><div class="sub">In progress right now</div></div>
    <div class="kpi good"><div class="lbl">Delivered</div><div class="stat-num">${delivered}</div><div class="sub">Completed runs</div></div>
    <div class="kpi good"><div class="lbl">Revenue</div><div class="stat-num">${fmtMoney(revenue)}</div><div class="sub">Booked, all loads</div></div>
    <div class="kpi bad"><div class="lbl">Expenses</div><div class="stat-num">${fmtMoney(expenses)}</div><div class="sub">Fuel, pay, maintenance</div></div>
    <div class="kpi warn"><div class="lbl">Outstanding Invoices</div><div class="stat-num">${fmtMoney(outstanding)}</div><div class="sub">${loads.filter(l=>l.status==='invoiced').length} invoice(s) open</div></div>
    <div class="kpi ${driverAlerts.length?'bad':''}"><div class="lbl">Driver Alerts</div><div class="stat-num">${driverAlerts.length}</div><div class="sub">CDL, medical, MVR</div></div>
    <div class="kpi ${truckAlerts.length?'bad':''}"><div class="lbl">Fleet Alerts</div><div class="stat-num">${truckAlerts.length}</div><div class="sub">Insurance, registration, inspection</div></div>
  </div>
  <div class="dash-cols">
    <div class="panel">
      <h3>Upcoming Pickups &amp; Deliveries</h3>
      ${upcoming.length? upcoming.map(u=>`<div class="row-item"><div><div class="t1">${u.load} — ${u.kind}</div><div class="t2">${u.loc}</div></div><div style="text-align:right"><div class="t1">${fmtDate(u.at)}</div><div class="t2">${u.dd<0?'overdue':u.dd===0?'today':'in '+u.dd+' days'}</div></div></div>`).join('') : '<div class="empty">Nothing scheduled in the next 5 days.</div>'}
    </div>
    <div class="panel">
      <h3>Alerts</h3>
      ${[...driverAlerts,...truckAlerts].length ? [...driverAlerts,...truckAlerts].map(a=>`<div class="alert-item"><div class="alert-dot ${a.sev}"></div><div>${a.text}</div></div>`).join('') : '<div class="empty">No open alerts.</div>'}
    </div>
  </div>`;
}

function calcMiles(){
  const pickup = document.getElementById('f_pickupLoc').value.trim();
  const delivery = document.getElementById('f_deliveryLoc').value.trim();
  const milesEl = document.getElementById('f_miles');

  if(!pickup || !delivery || pickup===delivery) { milesEl.value=''; return; }

  // Look up distance (try both directions)
  const key1 = pickup + '|' + delivery;
  const key2 = delivery + '|' + pickup;
  const miles = distanceMatrix[key1] || distanceMatrix[key2];

  if(miles) { milesEl.value = miles; }
}
function closeModal(){ document.getElementById('loadOverlay').classList.remove('open'); editingLoadId=null; }

function saveLoad(){
  const g = id => document.getElementById(id);
  const docFile = id => (g(id) && g(id).files && g(id).files[0]) ? g(id).files[0].name : null;
  const data = {
    pickupLoc: g('f_pickupLoc').value || 'TBD',
    deliveryLoc: g('f_deliveryLoc').value || 'TBD',
    pickupAt: g('f_pickupAt').value ? new Date(g('f_pickupAt').value).toISOString() : new Date().toISOString(),
    deliveryAt: g('f_deliveryAt').value ? new Date(g('f_deliveryAt').value).toISOString() : new Date().toISOString(),
    shipperId: g('f_shipperId').value || null,
    brokerId: g('f_brokerId').value || null,
    rate: parseFloat(g('f_rate').value)||0,
    miles: parseInt(g('f_miles').value)||0,
    hours: parseFloat(g('f_hours').value)||0,
    equipment: g('f_equipment').value,
    status: g('f_status').value,
    truckId: g('f_truckId').value || null,
    trailerId: g('f_trailerId').value || null,
    driverId: g('f_driverId').value || null,
    detention: parseFloat(g('f_detention').value)||0,
    layover: parseFloat(g('f_layover').value)||0,
    tonu: parseFloat(g('f_tonu').value)||0,
    notes: g('f_notes').value,
    refNum: g('f_refNum').value.trim(),
  };
  const newId = g('f_loadId').value.trim().toUpperCase() || (editingLoadId || nextLoadId());
  if(!/^[A-Z0-9][A-Z0-9\-_.\/]{0,29}$/.test(newId)){ alert('Load number can only use letters, numbers, - _ . / (max 30 characters).'); return; }
  if(newId !== editingLoadId && DB.loads.some(x=>x.id===newId)){ alert(`Load number ${newId} already exists. Choose a different one.`); return; }
  if(editingLoadId){
    const existing = DB.loads.find(x=>x.id===editingLoadId);
    Object.assign(existing, data);
    existing.docs = existing.docs || {};
    existing.docs.ratecon = docFile('f_doc_ratecon') || existing.docs.ratecon;
    existing.docs.bol = docFile('f_doc_bol') || existing.docs.bol;
    existing.docs.pod = docFile('f_doc_pod') || existing.docs.pod;
    if(newId !== editingLoadId) renameLoadId(editingLoadId, newId);
  } else {
    data.id = newId;
    data.docs = { ratecon: docFile('f_doc_ratecon'), bol: docFile('f_doc_bol'), pod: docFile('f_doc_pod') };
    DB.loads.push(data);
  }
  saveDB();
  closeModal();
  renderDispatch(document.getElementById('main'));
}

function renameLoadId(oldId, newId){
  const l = DB.loads.find(x=>x.id===oldId); if(l) l.id = newId;
  (DB.loadBoardPostings||[]).forEach(p=>{ if(p.loadId===oldId) p.loadId = newId; });
  (DB.factoringSubmissions||[]).forEach(f=>{ if(f.loadId===oldId) f.loadId = newId; });
  (DB.expenses||[]).forEach(e=>{ if(e.loadId===oldId) e.loadId = newId; });
  (DB.ownerOperatorSettlements||[]).forEach(st=>{ st.loadIds = (st.loadIds||[]).map(id=>id===oldId?newId:id); });
  (DB.driverSettlements||[]).forEach(st=>{ (st.lines||[]).forEach(x=>{ if(x.loadId===oldId) x.loadId = newId; }); });
}

function deleteLoad(loadId){
  const l = DB.loads.find(x=>x.id===loadId);
  if(!l) return;
  if(confirm(`Delete load ${l.id}?\n\nRoute: ${l.pickupLoc} → ${l.deliveryLoc}\nRate: ${fmtMoney(l.rate)}\n\nThis action cannot be undone.`)){
    DB.loads = DB.loads.filter(x=>x.id!==loadId);
    saveDB();
    renderDispatch(document.getElementById('main'));
    alert(`✓ Load ${l.id} deleted.`);
  }
}

function openLBConfigModal(board){
  const config = DB.loadBoardConfig.find(c=>c.board===board);
  if(!config) return;
  openEntityModal(`Configure ${config.name}`, `Add your API credentials to automatically sync loads`, [
    {id:'apiKey',label:'API Key',span2:true},
    {id:'apiUrl',label:'API Endpoint (optional)',span2:true},
    {id:'autoPost',label:'Auto-post available loads?',type:'select',options:[{value:'no',label:'No — manual posting only'},{value:'yes',label:'Yes — post automatically'}]},
  ], {apiKey:config.apiKey||'', apiUrl:config.apiUrl||'', autoPost:'no'}, ()=>{
    const g=k=>document.getElementById('ent_'+k).value;
    config.apiKey = g('apiKey');
    config.apiUrl = g('apiUrl');
    config.connected = !!g('apiKey');
    saveDB();
    renderLoadBoard(document.getElementById('main'));
    alert(`✅ ${config.name} configured!\n\nNote: In production, this API key is encrypted and stored securely.`);
  });
}
function postToBoard(loadId){
  const l = DB.loads.find(x=>x.id===loadId);
  const boards = ['DAT', 'Truckstop.com', 'Brokerages'];
  const boardChoices = boards.map(b=>{
    const config = DB.loadBoardConfig.find(c=>c.board===b);
    const status = config?.connected ? '✓ Connected' : 'Not configured';
    return {value:b, label:`${config?.name || b} — ${status}`};
  });

  openEntityModal('Post Load to Boards', `Select which boards to post ${l.id} to`, [
    {id:'boards',label:'Post to:',type:'select',options:boardChoices,span2:true},
  ], {boards:'DAT'}, ()=>{
    const board = document.getElementById('ent_boards').value;
    const prefix = board==='DAT'?'DAT':board==='Truckstop.com'?'TS':'BR';
    DB.loadBoardPostings.push({id:'lbp'+Date.now(), loadId, board, externalRef:prefix+'-'+Math.floor(Math.random()*90000+10000)+'-'+loadId.slice(2), postedRate:l.rate, status:'posted', postedAt:new Date().toISOString()});
    saveDB(); renderLoadBoard(document.getElementById('main'));
    alert(`✅ Load posted to ${board}!`);
  });
}
function bookPosting(id){
  const p = DB.loadBoardPostings.find(x=>x.id===id); p.status='booked'; p.bookedAt=new Date().toISOString();
  const l = DB.loads.find(x=>x.id===p.loadId); if(l && l.status==='available') l.status='assigned';
  saveDB(); renderLoadBoard(document.getElementById('main'));
}
function removePosting(id){
  const p = DB.loadBoardPostings.find(x=>x.id===id); p.status='removed';
  saveDB(); renderLoadBoard(document.getElementById('main'));
}
function importListing(id){
  const x = DB.loadBoardListings.find(l=>l.id===id);
  const newId = nextLoadId();
  let broker = DB.customers.find(c=>c.name===x.broker);
  if(!broker){ broker = {id:'cus'+Date.now(), name:x.broker, type:'broker', contact:'', email:'', phone:'', terms:'Quick Pay'}; DB.customers.push(broker); }
  DB.loads.push({id:newId, shipperId:null, brokerId:broker.id, pickupLoc:x.origin, deliveryLoc:x.destination, pickupAt:x.pickupDate, deliveryAt:x.pickupDate, rate:x.rate, miles:x.miles, equipment:x.equipment, truckId:null, trailerId:null, driverId:null, status:'available', detention:0, layover:0, tonu:0, notes:'Imported from '+x.board+' ('+x.externalRef+')', docs:{}});
  x.imported = true;
  saveDB(); renderLoadBoard(document.getElementById('main'));
}

      const sub = subs.find(s=>s.loadId===l.id);

      return `<div class="row-item"><div><div class="t1">${l.id} — ${custName(l.shipperId)}</div><div class="t2">${fmtMoney(l.rate)} · ${docsReady?'docs complete':'missing docs — funding may be delayed'}</div></div>
      <div>${sub ? pillColor(...FACT_STATUS_COLOR[sub.status], FACT_STATUS_LABEL[sub.status]) : `<button class="btn small" onclick="submitFactoring('${l.id}')">Submit to Factoring</button>`}</div></div>`;

      const fc = DB.factoringCompanies.find(c=>c.id===s.factoringId);
      if(!fc) return `<tr><td class="mono">${s.loadId}</td><td style="color:var(--danger);">Company not found</td><td>${fmtMoney(s.amount)}</td><td>—</td><td>—</td><td>${pillColor(...FACT_STATUS_COLOR[s.status],FACT_STATUS_LABEL[s.status])}</td><td></td></tr>`;

      return `<tr><td class="mono">${s.loadId}</td><td>${fc.name}</td><td>${fmtMoney(s.amount)}</td><td>${fmtMoney(advance)}</td><td>${fmtMoney(reserve)}</td><td>${pillColor(...FACT_STATUS_COLOR[s.status],FACT_STATUS_LABEL[s.status])}</td>

function submitFactoring(loadId){
  const l = DB.loads.find(x=>x.id===loadId);
  const active = DB.factoringCompanies.filter(c=>c.active);
  if(!l) return;
  if(!active.length){ alert('Add or activate a factoring company first.'); return; }
  let fc = active[0];
  if(active.length>1){
    const pick = prompt('Submit to which factoring company?\n\n' + active.map((c,i)=>`${i+1}. ${c.name} (${c.advanceRate}% advance, ${c.feePct}% fee)`).join('\n') + '\n\nEnter a number:', '1');
    if(pick===null) return;
    fc = active[parseInt(pick,10)-1];
    if(!fc){ alert('Invalid choice.'); return; }
  }
  DB.factoringSubmissions.push({id:'fs'+Date.now(), loadId, factoringId:fc.id, amount:l.rate, status:'submitted', submittedAt:new Date().toISOString(), fundedAt:null});
  saveDB(); renderFactoring(document.getElementById('main'));
}
function advanceFactoring(subId){
  const s = DB.factoringSubmissions.find(x=>x.id===subId); s.status='funded'; s.fundedAt=new Date().toISOString();
  const l = DB.loads.find(x=>x.id===s.loadId); if(l) l.status='paid';
  saveDB(); renderFactoring(document.getElementById('main'));
}

function openFactoringCompanyModal(id){
  if(DB.factoringCompanies.length >= 5 && !id){
    alert('Maximum 5 factoring companies allowed');
    return;
  }
  const c = id ? DB.factoringCompanies.find(x=>x.id===id) : null;
  openEntityModal(c?'Edit Factoring Company':'Add Factoring Company', c?'Update API credentials and settings':'Connect a new factoring company', [
    {id:'name',label:'Company Name',span2:true},
    {id:'apiKey',label:'API Key / Credentials',span2:true},
    {id:'apiUrl',label:'API Endpoint URL',span2:true},
    {id:'advanceRate',label:'Advance Rate (%)',type:'number'},
    {id:'feePct',label:'Fee Percentage (%)',type:'number'},
    {id:'active',label:'Status',type:'select',options:[{value:true,label:'Active'},{value:false,label:'Inactive'}]},
  ], c||{active:true}, ()=>{
    const g=k=>document.getElementById('ent_'+k).value;
    const data={name:g('name'),apiKey:g('apiKey'),apiUrl:g('apiUrl'),advanceRate:parseFloat(g('advanceRate'))||0,feePct:parseFloat(g('feePct'))||0,active:g('active')==='true'||g('active')===true};
    if(c) Object.assign(c,data);
    else DB.factoringCompanies.push({id:'fc'+Date.now(), ...data});
    saveDB(); renderFactoring(document.getElementById('main'));
    alert('✓ Factoring company '+(c?'updated':'added'));
  });
}

/* ---------- GENERIC ENTITY MODAL (Fleet / Drivers / Customers / Accounting forms) ---------- */
let entitySaveCallback = null;
function openEntityModal(title, sub, fields, values, onSave){
  document.getElementById('entityModalTitle').textContent = title;
  document.getElementById('entityModalSub').textContent = sub || '';
  document.getElementById('entityFormGrid').innerHTML = fields.map(f=>{
    const grp = f.group ? ' grp-'+f.group : '';
    if(f.type==='divider') return `<div class="section-divider${grp}">${f.label}</div>`;
    const val = esc((values && values[f.id]!=null) ? values[f.id] : '');
    if(f.type==='select') return `<div class="field ${f.span2?'span2':''}${grp}"><label>${f.label}</label><select id="ent_${f.id}" ${f.readonly?'disabled':''}>${f.options.map(o=>`<option value="${o.value}" ${String(o.value)===String(val)?'selected':''}>${o.label}</option>`).join('')}</select></div>`;
    if(f.type==='textarea') return `<div class="field span2${grp}"><label>${f.label}</label><textarea id="ent_${f.id}" ${f.readonly?'readonly':''}>${val}</textarea></div>`;
    return `<div class="field ${f.span2?'span2':''}${grp}"><label>${f.label}</label><input type="${f.type||'text'}" id="ent_${f.id}" value="${val}" ${f.readonly?'readonly':''} ${f.type==='number'?'step="any" min="0"':''}></div>`;
  }).join('');
  entitySaveCallback = onSave;
  document.getElementById('entityOverlay').classList.add('open');
}
function closeEntityModal(){ document.getElementById('entityOverlay').classList.remove('open'); entitySaveCallback=null; }
function saveEntityModal(){ if(entitySaveCallback && entitySaveCallback()===false) return; closeEntityModal(); }
function expPill(dateStr){
  const dd = daysUntil(dateStr);
  const color = dd<=7 ? ['#3B1E1E','#E5555C'] : dd<=30 ? ['#4A3A1E','#F0C878'] : ['#1B3B27','#5FE39A'];
  if(dd===Infinity) return '<span style="color:var(--dim)">—</span>';
  return pillColor(color[0], color[1], fmtDateOnly(dateStr) + (dd<0 ? ' (expired)' : dd<=30 ? ` (${dd}d)` : ''));
}

function deleteDriver(driverId){
  if(!currentUser || currentUser.role !== 'owner_admin') return;
  const d = DB.drivers.find(x=>x.id===driverId);
  if(!d) return;
  const activeLoads = DB.loads.filter(l=>l.driverId===driverId && !['delivered','documents_pending','invoiced','paid','cancelled'].includes(l.status));
  const linkedUsers = DB.users.filter(u=>u.driverId===driverId);
  let msg = `Delete driver: ${d.name}?`;
  if(activeLoads.length) msg += `\n\n${activeLoads.length} active load(s) will be unassigned: ${activeLoads.map(l=>l.id).join(', ')}`;
  if(linkedUsers.length) msg += `\n\nLinked login(s) will lose driver portal access: ${linkedUsers.map(u=>u.email).join(', ')}`;
  msg += '\n\nCompleted loads keep their history. This action cannot be undone.';
  if(!confirm(msg)) return;

  activeLoads.forEach(l=>{ l.driverId = null; if(['assigned','dispatched'].includes(l.status)) l.status = 'available'; });
  linkedUsers.forEach(u=>{ u.driverId = null; });
  (DB.ownerOperators||[]).forEach(o=>{ if(o.driverId===driverId) o.driverId = null; });
  DB.drivers = DB.drivers.filter(x=>x.id!==driverId);
  saveDB();
  renderDrivers(document.getElementById('main'));
  alert(`✓ Driver "${d.name}" deleted`);
}


function updateDriverPaymentInfo(){
  const driverSelect = document.getElementById('f_driverId');
  const driverId = driverSelect?.value;
  const infoDiv = document.getElementById('driverPaymentInfo');

  if(!infoDiv) return;
  if(!driverId){ infoDiv.style.display='none'; return; }

  const driver = DB.drivers.find(d=>d.id===driverId);
  if(!driver) { infoDiv.style.display='none'; return; }

  const miles = parseFloat(document.getElementById('f_miles')?.value || 0);
  const hours = parseFloat(document.getElementById('f_hours')?.value || 0);

  let paymentInfo = `<b>${driver.name}</b> ${driver.employeeId ? '('+driver.employeeId+')' : ''}<br>`;

  if(driver.classification === 'w2_employee'){
    paymentInfo += `<span style="color:var(--accent2);">W-2 Employee</span><br>`;
    if(driver.payType === 'per_mile'){
      paymentInfo += `Rate: $${driver.payRate}/mile<br>`;
      if(miles > 0) paymentInfo += `Expected: $${(miles * driver.payRate).toFixed(2)}`;
    } else if(driver.payType === 'per_hour'){
      paymentInfo += `Rate: $${driver.payRate}/hour<br>`;
      if(hours > 0) paymentInfo += `Expected: $${(hours * driver.payRate).toFixed(2)}`;
    } else if(driver.payType === 'percentage'){
      paymentInfo += `Rate: ${driver.payRate}% of load<br>`;
      const rate = parseFloat(document.getElementById('f_rate')?.value || 0);
      if(rate > 0) paymentInfo += `Expected: $${(rate * driver.payRate / 100).toFixed(2)}`;
    }
  } else {
    const oo = ooForDriver(driver.id);
    paymentInfo += `<span style="color:#8FB4F0;">Owner-Operator (1099)</span><br>` + (oo ? `Share: ${oo.ownerShare}% of gross` : 'No owner-operator agreement set — edit the driver');
  }

  infoDiv.innerHTML = paymentInfo;
  infoDiv.style.display = 'block';
}

function getNextEmployeeId(){
  const existingIds = DB.drivers.filter(d=>d.classification==='w2_employee').map(d=>d.employeeId).filter(id=>id && id.startsWith('DML'));
  const numbers = existingIds.map(id=>parseInt(id.replace('DML',''))).filter(n=>!isNaN(n));
  const nextNum = (numbers.length ? Math.max(...numbers) : 0) + 1;
  return 'DML' + String(nextNum).padStart(2, '0');
}

function r2(n){ return Math.round((Number(n)||0)*100)/100; }
function fmtMoney2(n){ const v=Number(n)||0; return (v<0?'-':'')+'$'+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function localDate(dt){ const p=n=>String(n).padStart(2,'0'); return `${dt.getFullYear()}-${p(dt.getMonth()+1)}-${p(dt.getDate())}`; }
function ooForDriver(driverId){ const d = DB.drivers.find(x=>x.id===driverId); if(d && d.classification!=='owner_operator_1099') return null; return (DB.ownerOperators||[]).find(o=>o.driverId===driverId) || null; }
function loadGross(l){ return (Number(l.rate)||0)+(Number(l.detention)||0)+(Number(l.layover)||0)+(Number(l.tonu)||0); }
function canManageSettlements(){ return !!currentUser && ['owner_admin','accounting'].includes(currentUser.role); }
function settlementPill(st){ const c=SETTLE_STATUS_COLOR[st]||['#28394C','#B9C9DA']; return pillColor(c[0],c[1],SETTLE_STATUS_LABEL[st]||st); }
function payBasisLabel(d, oo){
  if(oo) return `${Number(oo.ownerShare)||0}% of gross revenue`;
  const rate = Number(d.payRate)||0;
  if(d.payType==='per_mile') return `$${rate.toFixed(2)} per mile`;
  if(d.payType==='per_hour') return `$${rate.toFixed(2)} per hour`;
  if(d.payType==='percentage') return `${rate}% of line haul`;
  return 'Pay rate not set';
}
function calcLoadPay(d, l, oo){
  if(oo) return r2(loadGross(l) * (Number(oo.ownerShare)||0) / 100);
  const rate = Number(d.payRate)||0;
  if(d.payType==='per_mile') return r2((Number(l.miles)||0) * rate);
  if(d.payType==='per_hour') return r2((Number(l.hours)||0) * rate);
  if(d.payType==='percentage') return r2((Number(l.rate)||0) * rate / 100);
  return 0;
}
function settledLoadIds(){ return new Set((DB.driverSettlements||[]).flatMap(s=>(s.lines||[]).map(x=>x.loadId))); }
function nextSettlementNo(){
  const nums = (DB.driverSettlements||[]).map(s=>parseInt(String(s.number||'').replace(/^STL-/,''),10)).filter(n=>!isNaN(n));
  return 'STL-' + ((nums.length ? Math.max(...nums) : 1000) + 1);
}

  const rows = all.filter(s=>settlementFilter==='all' || s.status===settlementFilter)

  <div class="topbar"><div><h1>Driver Settlements</h1><div class="desc">Pay drivers for completed loads — company drivers and owner-operators</div></div>
    ${canManageSettlements() ? '<button class="btn" onclick="openNewSettlement()">+ New Settlement</button>' : ''}</div>
  <div class="kpi-grid">
    <div class="kpi warn"><div class="lbl">Pending Approval</div><div class="stat-num">${cnt('pending')}</div><div class="sub">${fmtMoney2(tot('pending'))} net</div></div>
    <div class="kpi accent"><div class="lbl">Approved</div><div class="stat-num">${cnt('approved')}</div><div class="sub">${fmtMoney2(tot('approved'))} ready to pay</div></div>
    <div class="kpi good"><div class="lbl">Paid</div><div class="stat-num">${cnt('paid')}</div><div class="sub">${fmtMoney2(tot('paid'))} paid out</div></div>
    <div class="kpi ${unsettled.length?'bad':''}"><div class="lbl">Unsettled Loads</div><div class="stat-num">${unsettled.length}</div><div class="sub">Completed, not yet on a settlement</div></div>
  </div>
  <div class="filters">
    <select onchange="settlementFilter=this.value; renderSettlements(document.getElementById('main'))">
      ${[['all','All statuses'],['pending','Pending Approval'],['approved','Approved'],['paid','Paid']].map(([v,t])=>`<option value="${v}" ${settlementFilter===v?'selected':''}>${t}</option>`).join('')}
    </select>
  </div>
  <div class="table-wrap"><table>
    <thead><tr><th>Settlement #</th><th>Driver</th><th>Type</th><th>Pay Period</th><th>Loads</th><th>Gross Pay</th><th>Deductions</th><th>Net Pay</th><th>Status</th><th></th></tr></thead>
    <tbody>${rows.map(s=>`<tr onclick="openSettlementStatement('${s.id}')">
      <td class="mono">${esc(s.number)}</td>
      <td><b>${esc(s.driverName)}</b></td>
      <td>${s.classification==='owner_operator_1099'?pillColor('#3D4A6B','#8FB4F0','1099'):pillColor('#2E5C3E','#5FE39A','Company')}</td>
      <td style="font-size:12px;">${fmtDateOnly(s.periodStart+'T12:00:00')} – ${fmtDateOnly(s.periodEnd+'T12:00:00')}</td>
      <td>${(s.lines||[]).length}</td>
      <td>${fmtMoney2(s.grossPay)}</td>
      <td>${fmtMoney2(s.totalDeductions)}</td>
      <td><b>${fmtMoney2(s.netPay)}</b></td>
      <td>${settlementPill(s.status)}</td>
      <td onclick="event.stopPropagation()" style="display:flex;gap:6px;">
        <button class="btn small secondary" onclick="openSettlementStatement('${s.id}')">View</button>
        ${canManageSettlements() && s.status==='pending' ? `<button class="btn small" onclick="setSettlementStatus('${s.id}','approved','list')">Approve</button>` : ''}
        ${canManageSettlements() && s.status==='approved' ? `<button class="btn small" onclick="setSettlementStatus('${s.id}','paid','list')">Mark Paid</button>` : ''}
        ${canManageSettlements() ? `<button class="btn small secondary" style="color:var(--danger);" onclick="deleteDriverSettlement('${s.id}')">Delete</button>` : ''}
      </td></tr>`).join('') || `<tr><td colspan="10" style="text-align:center;color:var(--dim);padding:26px;">No settlements yet.${canManageSettlements()?' Click “+ New Settlement” to pay a driver for completed loads.':''}</td></tr>`}
    </tbody></table></div>
  ${unsettled.length ? `<div class="panel" style="margin-top:16px;"><h3>Completed Loads Waiting on a Settlement</h3>
    ${unsettled.map(l=>`<div class="row-item"><div><div class="t1">${esc(l.id)} — ${driverName(l.driverId)}</div><div class="t2">${esc(l.pickupLoc)} → ${esc(l.deliveryLoc)} · delivered ${fmtDateOnly(l.deliveryAt)}</div></div><span class="pill st-${l.status}">${STATUS_LABEL[l.status]}</span></div>`).join('')}
  </div>` : ''}`;
}

  const end = new Date(); const start = new Date(); start.setDate(start.getDate()-13);

  const overlay = document.createElement('div');
  overlay.className = 'overlay open dyn-overlay';
  overlay.innerHTML = `
  <div class="modal modal-wrap" style="max-width:780px;">
    <button class="close-x" onclick="closeDynOverlay()">✕</button>
    <h2>New Driver Settlement</h2>
    <div class="modal-sub">Pulls the driver's completed loads delivered in the pay period that haven't been settled yet.</div>
    <div class="form-grid">
      <div class="field span2"><label>Driver</label>
        <select id="stlDriver" onchange="stlRefresh(true)"><option value="">— Select driver —</option>
          ${drivers.map(d=>`<option value="${d.id}">${esc(d.name)}${ooForDriver(d.id)||d.classification==='owner_operator_1099'?' (1099)':''}</option>`).join('')}
        </select>
        <div id="stlBasis" style="font-size:12px;color:var(--dim);margin-top:6px;"></div>
      </div>
      <div class="field"><label>Pay Period Start</label><input type="date" id="stlStart" value="${localDate(start)}" onchange="stlRefresh(false)"></div>
      <div class="field"><label>Pay Period End</label><input type="date" id="stlEnd" value="${localDate(end)}" onchange="stlRefresh(false)"></div>
      <div class="section-divider">Loads in Period</div>
      <div class="span2" id="stlLoads" style="border:1px solid var(--border);border-radius:8px;max-height:230px;overflow-y:auto;padding:0 10px;"><div class="empty">Choose a driver.</div></div>
      <div class="section-divider">Additional Earnings</div>
      ${money('stl_bonus','Bonus ($)')}${money('stl_reimb','Reimbursements — lumper, tolls, etc. ($)')}
      <div class="section-divider">Deductions</div>
      <div class="field"><label>Dispatch Fee (% of freight gross)</label><input type="number" step="0.1" min="0" id="stl_dispatchPct" value="0" oninput="stlRecalc()"></div>
      ${money('stl_fuelAdvance','Fuel Advance / Fuel Card ($)')}
      ${money('stl_insurance','Insurance ($)')}${money('stl_eld','ELD / Tech Fee ($)')}
      ${money('stl_trailer','Trailer Rental ($)')}${money('stl_maint','Maintenance / Escrow ($)')}
      ${money('stl_other','Other Deductions ($)')}
      <div class="field"><label>Other Deduction Note</label><input id="stl_otherNote" placeholder="e.g. cash advance 9/24"></div>
      <div class="field span2"><label>Notes on Statement</label><textarea id="stl_notes" placeholder="Shown on the driver's statement"></textarea></div>
      <div class="span2" id="stlSummary"></div>
    </div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeDynOverlay()">Cancel</button>
      <button class="btn" onclick="submitNewSettlement()">Create Settlement</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  stlRecalc();
}

function stlEligibleLoads(driverId, start, end){
  if(!driverId || !start || !end) return [];
  const settled = settledLoadIds();
  const s = new Date(start+'T00:00:00'), e = new Date(end+'T23:59:59');
  return DB.loads.filter(l=>l.driverId===driverId && SETTLE_DONE.includes(l.status) && !settled.has(l.id) && new Date(l.deliveryAt)>=s && new Date(l.deliveryAt)<=e)
    .sort((a,b)=>new Date(a.deliveryAt)-new Date(b.deliveryAt));
}

function stlRefresh(driverChanged){
  const g = id => document.getElementById(id);
  const d = DB.drivers.find(x=>x.id===g('stlDriver').value);
  const box = g('stlLoads');
  if(!d){ box.innerHTML='<div class="empty">Choose a driver.</div>'; g('stlBasis').textContent=''; stlRecalc(); return; }
  const oo = ooForDriver(d.id);
  const kind = oo || d.classification==='owner_operator_1099' ? 'Owner-operator (1099)' : 'Company driver (W-2)';
  g('stlBasis').innerHTML = `${kind} · Pays <b style="color:var(--text)">${payBasisLabel(d,oo)}</b>${!oo && d.classification==='owner_operator_1099' ? ' · <span style="color:var(--warn)">No owner-operator agreement linked — using the driver pay rate</span>' : ''}`;
  if(driverChanged){
    g('stl_dispatchPct').value = oo ? (Number(oo.dispatchPercentage)||0) : 0;
    g('stl_insurance').value = oo ? (Number(oo.insuranceDeduction)||0) : 0;
    g('stl_eld').value = oo ? (Number(oo.eldMonthlyFee)||0) : 0;
    g('stl_trailer').value = oo ? (Number(oo.trailerRentalMonthly)||0) : 0;
    g('stl_maint').value = oo ? (Number(oo.maintenancePool)||0) : 0;
  }
  const start = g('stlStart').value, end = g('stlEnd').value;
  if(start && end && end < start){ box.innerHTML = '<div class="empty" style="color:var(--danger);">Period end is before the start date.</div>'; stlRecalc(); return; }
  const loads = stlEligibleLoads(d.id, start, end);
  const hourlyMissing = !oo && d.payType==='per_hour' && loads.some(l=>!l.hours);
  box.innerHTML = loads.length ? loads.map(l=>`
    <label class="stl-line"><input type="checkbox" class="stl-load" value="${esc(l.id)}" checked onchange="stlRecalc()">
      <span><b>${esc(l.id)}</b> ${esc(l.pickupLoc)} → ${esc(l.deliveryLoc)}
      <span class="t2"> · delivered ${fmtDateOnly(l.deliveryAt)} · ${l.miles||0} mi${!oo && d.payType==='per_hour' ? ' · '+(l.hours||0)+' h' : ''} · freight ${fmtMoney2(loadGross(l))}</span></span>
      <b>${fmtMoney2(calcLoadPay(d,l,oo))}</b></label>`).join('')
    + (hourlyMissing ? '<div style="color:var(--warn);font-size:12px;padding:8px 0;">Some loads have no hours entered — edit the load in Dispatch to add Hours Worked.</div>' : '')
    : '<div class="empty">No unsettled completed loads for this driver in this period.</div>';
  stlRecalc();
}

function stlCompute(){
  const g = id => document.getElementById(id);
  const num = id => Math.max(0, parseFloat(g(id)?.value)||0);
  const d = DB.drivers.find(x=>x.id===g('stlDriver')?.value);
  if(!d) return null;
  const oo = ooForDriver(d.id);
  const lines = [...document.querySelectorAll('.stl-load:checked')].map(c=>{
    const l = DB.loads.find(x=>x.id===c.value);
    return {loadId:l.id, route:l.pickupLoc+' → '+l.deliveryLoc, deliveredAt:l.deliveryAt, miles:Number(l.miles)||0, hours:Number(l.hours)||0,
      lineHaul:Number(l.rate)||0, accessorials:r2(loadGross(l)-(Number(l.rate)||0)), gross:r2(loadGross(l)), pay:calcLoadPay(d,l,oo)};
  });
  const freightGross = r2(lines.reduce((a,x)=>a+x.gross,0));
  const earnings = {loadPay:r2(lines.reduce((a,x)=>a+x.pay,0)), bonus:num('stl_bonus'), reimbursements:num('stl_reimb')};
  const grossPay = r2(earnings.loadPay + earnings.bonus + earnings.reimbursements);
  const dispatchPct = num('stl_dispatchPct');
  const deductions = {dispatchFee:r2(freightGross*dispatchPct/100), fuelAdvance:num('stl_fuelAdvance'), insurance:num('stl_insurance'), eldFee:num('stl_eld'),
    trailerRental:num('stl_trailer'), maintenance:num('stl_maint'), other:num('stl_other')};
  const totalDeductions = r2(Object.values(deductions).reduce((a,b)=>a+b,0));
  return {d, oo, lines, freightGross, earnings, grossPay, dispatchPct, deductions, totalDeductions, netPay:r2(grossPay-totalDeductions)};
}

function stlRecalc(){
  const box = document.getElementById('stlSummary'); if(!box) return;
  const c = stlCompute();
  if(!c){ box.innerHTML=''; return; }
  box.innerHTML = `<div style="background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center;">
    <div><div class="t2" style="font-size:11px;color:var(--dim);">LOADS</div><div style="font-weight:700;font-size:18px;">${c.lines.length}</div></div>
    <div><div style="font-size:11px;color:var(--dim);">GROSS PAY</div><div style="font-weight:700;font-size:18px;color:var(--accent);">${fmtMoney2(c.grossPay)}</div></div>
    <div><div style="font-size:11px;color:var(--dim);">DEDUCTIONS</div><div style="font-weight:700;font-size:18px;color:var(--danger);">${fmtMoney2(c.totalDeductions)}</div></div>
    <div><div style="font-size:11px;color:var(--dim);">NET PAY</div><div style="font-weight:800;font-size:22px;color:${c.netPay<0?'var(--danger)':'var(--accent2)'};">${fmtMoney2(c.netPay)}</div></div>
  </div>`;
}

function submitNewSettlement(){
  const g = id => document.getElementById(id);
  const c = stlCompute();
  const start = g('stlStart').value, end = g('stlEnd').value;
  if(!c){ alert('Choose a driver.'); return; }
  if(!start || !end){ alert('Enter the pay period dates.'); return; }
  if(end < start){ alert('Pay period end must be on or after the start date.'); return; }
  if(!c.lines.length && c.grossPay<=0){ alert('Select at least one load or enter a bonus/reimbursement.'); return; }
  if(c.netPay < 0 && !confirm(`Net pay is ${fmtMoney2(c.netPay)} (deductions exceed earnings). Create anyway?`)) return;
  const otherNote = g('stl_otherNote').value.trim();
  DB.driverSettlements = DB.driverSettlements || [];
  const rec = {
    id:'dst_'+Date.now(), number:nextSettlementNo(),
    driverId:c.d.id, driverName:c.d.name,
    classification: c.oo || c.d.classification==='owner_operator_1099' ? 'owner_operator_1099' : 'w2_employee',
    payBasis: payBasisLabel(c.d, c.oo),
    periodStart:start, periodEnd:end,
    lines:c.lines, freightGross:c.freightGross, earnings:c.earnings, grossPay:c.grossPay,
    dispatchPct:c.dispatchPct, deductions:c.deductions, otherDeductionNote:otherNote, totalDeductions:c.totalDeductions, netPay:c.netPay,
    notes:g('stl_notes').value.trim(), status:'pending',
    createdBy: currentUser ? currentUser.name : 'System', createdAt:new Date().toISOString()
  };
  DB.driverSettlements.push(rec);
  saveDB();
  closeDynOverlay();
  openSettlementStatement(rec.id);
}

    ['Other'+(s.otherDeductionNote?' — '+esc(s.otherDeductionNote):''), dd.other],

  <div class="panel" style="margin-bottom:16px;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;">
      <div><div style="font-family:'Big Shoulders Display',sans-serif;font-size:26px;font-weight:800;">Drive Mode Logistics</div>
        <div style="color:var(--dim);font-size:13px;">Driver Settlement Statement</div></div>
      <div style="text-align:right;"><div class="mono" style="font-size:14px;color:var(--text);">${esc(s.number)}</div><div style="margin-top:6px;">${settlementPill(s.status)}</div></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-top:18px;font-size:13px;">

      <div><div style="color:var(--dim);font-size:11px;text-transform:uppercase;">Type</div><div style="font-weight:600;">${isOO?'Owner-operator (1099)':'Company driver (W-2)'}</div></div>
      <div><div style="color:var(--dim);font-size:11px;text-transform:uppercase;">Pay Basis</div><div style="font-weight:600;">${esc(s.payBasis)}</div></div>
      <div><div style="color:var(--dim);font-size:11px;text-transform:uppercase;">Pay Period</div><div style="font-weight:600;">${fmtDateOnly(s.periodStart+'T12:00:00')} – ${fmtDateOnly(s.periodEnd+'T12:00:00')}</div></div>
      ${s.paidAt ? `<div><div style="color:var(--dim);font-size:11px;text-transform:uppercase;">Paid On</div><div style="font-weight:600;">${fmtDateOnly(s.paidAt)}</div></div>` : ''}

function renderDocuments(main){
  // Categorize document types
  const docCategories = {
    POD: { label:'Proof of Delivery', color:'#2E5C3E', icon:'✓' },
    BOL: { label:'Bill of Lading', color:'#3D4A6B', icon:'📋' },
    INSURANCE: { label:'Insurance & Compliance', color:'#5C3D2E', icon:'🛡️' }
  };

  // Function to determine doc category
  function getDocCategory(type){
    const t = type.toLowerCase();
    if(t.includes('pod') || t.includes('proof') || t.includes('delivery') || t.includes('signature')) return 'POD';
    if(t.includes('bol') || t.includes('bill of lading') || t.includes('shipping')) return 'BOL';
    if(t.includes('insurance') || t.includes('cdl') || t.includes('medical') || t.includes('registration')) return 'INSURANCE';
    return 'BOL'; // default
  }

  const docs = {POD:[], BOL:[], INSURANCE:[]};

  // Collect uploaded documents
  if(DB.documents){
    DB.documents.forEach(d=>{
      const cat = getDocCategory(d.category);
      docs[cat].push({id:d.id, type:d.type, related:d.related, file:d.content.substring(0,50)+'...', docClass:'Upload', uploadedAt:d.uploadedAt});
    });
  }

  // Collect load documents
  DB.loads.forEach(l=>{
    Object.entries(l.docs).forEach(([type,file])=>{
      if(file){
        const cat = getDocCategory(type);
        docs[cat].push({type, related:l.id, file, docClass:'Load'});
      }
    });
  });

  // Collect driver documents
  DB.drivers.forEach(d=>{
    docs.INSURANCE.push({type:'CDL', related:d.name, file:d.cdl||'On file', docClass:'Driver'});
    docs.INSURANCE.push({type:'Medical Card', related:d.name, file:'expires '+fmtDateOnly(d.medExp), docClass:'Driver'});
  });

  // Collect truck documents
  DB.trucks.forEach(t=>{
    docs.BOL.push({type:'Registration', related:t.unit, file:'expires '+fmtDateOnly(t.regExp), docClass:'Fleet'});
    docs.INSURANCE.push({type:'Insurance', related:t.unit, file:'expires '+fmtDateOnly(t.insExp), docClass:'Fleet'});
  });

  // Build HTML with categorized sections
  let html = `<div class="topbar"><div><button class="btn secondary" style="padding:6px 12px;font-size:14px;margin-right:12px;" onclick="navigate('dashboard')">← Back to Dashboard</button><h1>Document Center</h1><div class="desc">All company documents organized by category</div></div>
  ${currentUser && currentUser.role === 'owner_admin' ? `<div style="display:flex;gap:8px;"><button class="btn" onclick="openUploadDocModal()">+ Upload Document</button><button class="btn secondary" style="color:var(--danger);" onclick="deleteAllDocuments()">Delete All</button></div>` : ''}</div>`;

  Object.entries(docCategories).forEach(([key, cat])=>{
    const items = docs[key]||[];
    html += `
    <div class="panel">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
        <span style="font-size:20px;">${cat.icon}</span>
        <h3 style="margin:0;color:${cat.color};">${cat.label}</h3>
        <span style="margin-left:auto;background:var(--panel2);padding:4px 12px;border-radius:16px;font-size:12px;font-weight:600;">${items.length} doc(s)</span>
      </div>
      ${items.length?
        `<div class="table-wrap" style="border:none;"><table><thead><tr><th>Document Type</th><th>Related To</th><th style="font-size:12px;color:var(--dim);">Class</th><th>File / Detail</th><th>Uploaded</th>${currentUser && currentUser.role === 'owner_admin' ? '<th></th>' : ''}</tr></thead>
        <tbody>${items.map(d=>`<tr><td><b>${esc(d.type)}</b></td><td>${esc(d.related)}</td><td style="font-size:12px;color:var(--dim);">${d.docClass}</td><td class="mono" style="font-size:12px;"><button class="btn small secondary" style="padding:2px 6px;font-size:11px;" onclick="editDocument('${d.id||''}', '')">View/Edit</button></td><td style="font-size:12px;color:var(--dim);">${d.uploadedAt ? fmtDateOnly(d.uploadedAt) : '-'}</td>${currentUser && currentUser.role === 'owner_admin' ? `<td style="text-align:center;"><button class="btn small secondary" style="color:var(--danger);padding:4px 8px;font-size:11px;" onclick="deleteDocument('${d.docClass}','${esc(String(d.related).replace(/'/g,"\\'"))}','${esc(String(d.type).replace(/'/g,"\\'"))}','${d.id||''}')">Delete</button></td>` : ''}</tr>`).join('')}</tbody></table></div>`
        :`<div style="padding:24px;text-align:center;color:var(--dim);background:var(--panel2);border-radius:8px;font-size:14px;">No documents yet</div>`}
    </div>`;
  });

  main.innerHTML = html;
}

function deleteDocument(docClass, related, docType, docId){
  if(!confirm(`Delete ${docType} for ${related}?\n\nThis action cannot be undone.`)) return;

  if(docId && DB.documents){
    const idx = DB.documents.findIndex(d=>d.id===docId);
    if(idx > -1) DB.documents.splice(idx, 1);
  } else if(docClass === 'Load'){
    const load = DB.loads.find(l => l.id === related);
    if(load){
      const docKey = docType.toLowerCase().replace(/\s+/g, '_');
      if(docKey === 'rate_confirmation' || docKey === 'ratecon') delete load.docs.ratecon;
      else if(docKey === 'bol') delete load.docs.bol;
      else if(docKey === 'pod') delete load.docs.pod;
    }
  }

  saveDB();
  renderDocuments(document.getElementById('main'));
  alert('✓ Document deleted');
}

function deleteAllDocuments(){

  saveDB();
  renderDocuments(document.getElementById('main'));

}

/* ---------- EMAIL DELIVERY + PASSWORD RESET ---------- */
const CODE_TTL_MIN = 15, CODE_MAX_TRIES = 5;
function emailCfg(){ return DB.emailConfig || {}; }
function emailLive(){ const c = emailCfg(); return !!(c.enabled && c.serviceId && c.templateId && c.publicKey); }
function genCode(){ const a = new Uint32Array(1); crypto.getRandomValues(a); return String(a[0] % 1000000).padStart(6,'0'); }
const ROLE_NAMES = {owner_admin:'Owner / Admin', dispatcher:'Dispatcher', accounting:'Accounting', safety:'Safety', driver:'Driver', customer:'Customer'};
function signInLink(){ return /^https?:/.test(location.protocol) ? location.origin + location.pathname : 'https://DriveModeTMS.com'; }
async function sendWelcomeEmail(user){
  const c = emailCfg();
  const message = `Hi ${user.name},\n\nYour Drive Mode TMS account has been created.\n\nSign-in email: ${user.email}\nRole: ${ROLE_NAMES[user.role]||user.role}\nSign in at: ${signInLink()}\n\nYour administrator will give you your password. You can also set your own anytime with "Forgot password?" on the sign-in screen.\n\nIf you weren't expecting this account, reply to this email or contact ${c.fromName||'Drive Mode Logistics'}.`;
  const r = await sendEmail(user.email, 'Your Drive Mode TMS account is ready', message);
  user.welcomeEmail = r.demo ? 'not_sent_demo' : r.ok ? 'sent' : 'failed';
  user.welcomeEmailAt = new Date().toISOString();
  saveDB();
  return r;
}
async function resendWelcome(userId){
  const u = DB.users.find(x=>x.id===userId); if(!u) return;
  if(!emailLive()){ alert('Email Delivery is in demo mode, so no email can be sent.\n\nTurn it on under Users → ✉ Email Delivery.'); return; }
  const r = await sendWelcomeEmail(u);
  alert(r.ok ? `✓ Confirmation email sent to ${u.email}` : `✗ Couldn't send the email: ${r.error}`);
  renderUsers(document.getElementById('main'));
}
async function sendEmail(to, subject, message){
  if(!emailLive()) return {ok:true, demo:true};
  const c = emailCfg();
  try{
    const r = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({service_id:c.serviceId, template_id:c.templateId, user_id:c.publicKey,
        template_params:{to_email:to, subject, message, app_name:'Drive Mode TMS', from_name:c.fromName||'Drive Mode TMS'}})
    });
    if(!r.ok) return {ok:false, error: (await r.text().catch(()=>'')) || ('HTTP '+r.status)};
    return {ok:true};
  }catch(e){ return {ok:false, error:String(e.message||e)}; }
}
async function issueCode(user, purpose){
  const code = genCode();
  user[purpose+'Code'] = code;
  user[purpose+'Expires'] = Date.now() + CODE_TTL_MIN*60000;
  user[purpose+'Tries'] = 0;
  saveDB();
  const subject = 'Reset your Drive Mode TMS password';
  const message = `Hi ${user.name},\n\nYour Drive Mode TMS password reset code is: ${code}\n\nIt expires in ${CODE_TTL_MIN} minutes. If you didn't ask to reset your password, ignore this email — your password won't change.`;
  const res = await sendEmail(user.email, subject, message);
  return {...res, code};
}
function checkCode(user, purpose, entered){
  const code = user[purpose+'Code'], exp = user[purpose+'Expires'];
  if(!code || !exp) return 'Request a new code.';
  if(Date.now() > exp) return 'This code has expired. Request a new one.';
  if((user[purpose+'Tries']||0) >= CODE_MAX_TRIES) return 'Too many wrong attempts. Request a new code.';
  if(String(entered).trim() !== code){ user[purpose+'Tries'] = (user[purpose+'Tries']||0)+1; saveDB(); return `Incorrect code. ${CODE_MAX_TRIES-user[purpose+'Tries']} tries left.`; }
  delete user[purpose+'Code']; delete user[purpose+'Expires']; delete user[purpose+'Tries'];
  return null;
}
function findUserByEmail(email){ const e = String(email||'').trim().toLowerCase(); return DB.users.find(u=>String(u.email||'').trim().toLowerCase()===e); }
function maskEmail(e){ const [n,d] = String(e).split('@'); return (n.length<=2 ? n[0]+'*' : n.slice(0,2)+'*'.repeat(Math.min(6,n.length-2))) + '@' + d; }
function deliveryNote(res){
  if(!res) return '';
  if(res.info) return `<div class="auth-msg bad">${esc(res.info)}</div>`;
  if(!res.ok) return `<div class="auth-msg bad">Couldn't send the email: ${esc(res.error)}. Ask an admin to check Email Delivery settings.</div>`;
  if(res.demo) return `<div class="auth-msg demo"><b>Demo mode</b> — email isn't set up yet, so the code is shown here: <span class="mono" style="font-size:15px;color:var(--text);letter-spacing:2px;">${res.code}</span></div>`;
  return '';
}

      <div class="field" style="margin-bottom:12px;"><label>New Password (min 8 characters)</label><input id="resetPw" type="password" autocomplete="new-password"></div>
      <div class="field" style="margin-bottom:6px;"><label>Confirm New Password</label><input id="resetPw2" type="password" autocomplete="new-password" ${enter('submitReset')}></div>
      <div id="authErr" class="auth-err"></div>

function authBusy(on){ document.querySelectorAll('#authCard .btn').forEach(b=>{ b.disabled=on; b.style.opacity=on?.6:1; }); }

async function submitForgot(prefill){
  const email = (prefill || document.getElementById('forgotEmail')?.value || '').trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ const e=document.getElementById('authErr'); if(e) e.textContent='Enter a valid email address.'; return; }
  authBusy(true);
  const u = findUserByEmail(email);
  let res = null;
  if(u && u.active) res = await issueCode(u, 'reset');
  // Same screen whether or not the account exists, so the form can't be used to discover accounts.
  // In demo mode there's no inbox, so the code (or a "no account" hint) is shown instead.
  if(!u && !emailLive()) res = {info:'Demo mode: there is no account with that email in this browser. Check the spelling, or ask an admin to create the account.'};
  if(u && !u.active) res = emailLive() ? null : {info:'Demo mode: this account is deactivated. Ask an admin to reactivate it.'};
  renderAuth('reset', {email, sendResult:res});
}
function submitReset(){
  const e = document.getElementById('authErr');
  const pw = document.getElementById('resetPw').value.trim(), pw2 = document.getElementById('resetPw2').value.trim();
  const u = findUserByEmail(authState.email);
  if(!u || !u.active){ e.textContent = 'Incorrect code.'; return; }
  if(pw.length < 8){ e.textContent = 'Password must be at least 8 characters.'; return; }
  if(pw !== pw2){ e.textContent = 'Passwords do not match.'; return; }
  const err = checkCode(u, 'reset', document.getElementById('authCode').value);
  if(err){ e.textContent = err; return; }
  u.password = pw; u.passwordChangedAt = new Date().toISOString();
  saveDB();
  renderAuth('signin', {email:u.email, notice:'Password updated. Sign in with your new password.'});
}

/* ---- admin: email delivery settings + verification tools ---- */
function openEmailSettings(){
  const c = emailCfg();
  openEntityModal('Email Delivery', 'Sends account confirmation emails and password-reset codes through EmailJS (emailjs.com). Your EmailJS template must use {{to_email}} as the recipient and {{subject}} and {{message}} in the email.', [
    {id:'enabled',label:'Status',type:'select',options:[{value:'false',label:'Off — demo mode (codes shown on screen)'},{value:'true',label:'On — send real emails'}],span2:true},
    {id:'serviceId',label:'EmailJS Service ID'},{id:'templateId',label:'EmailJS Template ID'},
    {id:'publicKey',label:'EmailJS Public Key',span2:true},
    {id:'fromName',label:'From Name',span2:true},
    {id:'testTo',label:'Send a test email to (optional)',span2:true},
  ], {enabled:String(!!c.enabled), serviceId:c.serviceId||'', templateId:c.templateId||'', publicKey:c.publicKey||'', fromName:c.fromName||'Drive Mode Logistics', testTo:currentUser?.email||''}, ()=>{
    const g = k => document.getElementById('ent_'+k).value.trim();
    const cfg = {enabled:g('enabled')==='true', serviceId:g('serviceId'), templateId:g('templateId'), publicKey:g('publicKey'), fromName:g('fromName')};
    if(cfg.enabled && (!cfg.serviceId || !cfg.templateId || !cfg.publicKey)){ alert('Enter the Service ID, Template ID and Public Key to turn email on.'); return false; }
    DB.emailConfig = cfg; saveDB();
    const to = g('testTo');
    if(cfg.enabled && to){
      sendEmail(to, 'Drive Mode TMS test email', 'This is a test from Drive Mode TMS. Email delivery is working.').then(r=>{
        alert(r.ok ? `✓ Test email sent to ${to}` : `✗ Test email failed: ${r.error}`);
      });
    }
    renderUsers(document.getElementById('main'));
  });
}

/* ---------- USER MANAGEMENT ---------- */
function renderUsers(main){
  main.innerHTML = `<div class="topbar"><div><button class="btn secondary" style="padding:6px 12px;font-size:14px;margin-right:12px;" onclick="navigate('dashboard')">← Back to Dashboard</button><h1>User Management</h1><div class="desc">Create accounts, manage roles and permissions</div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn secondary" onclick="openEmailSettings()">✉ Email Delivery: ${emailLive()?'On':'Demo'}</button><button class="btn" onclick="openCreateUserModal()">+ New User</button></div></div>
  ${!emailLive() ? '<div class="auth-msg demo" style="margin-bottom:16px;">Email delivery is in <b>demo mode</b>: account confirmation emails are not sent, and password-reset codes are shown on screen instead of emailed. Click “Email Delivery” to connect EmailJS.</div>' : ''}
  <div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Confirmation Email</th><th>Status</th><th>Created</th><th></th></tr></thead>
  <tbody>${DB.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td><span class="pill" style="background:var(--panel2);color:var(--text)">${u.role.replace('_',' / ')}</span></td>
    <td>${u.welcomeEmail==='sent' ? pillColor('#173A24','#5FE39A','Sent '+fmtDateOnly(u.welcomeEmailAt)) : u.welcomeEmail==='failed' ? pillColor('#3B1E1E','#E5555C','Failed') : u.welcomeEmail==='not_sent_demo' ? pillColor('#4A3A1E','#F0C878','Not sent') : '<span style="color:var(--dim)">—</span>'}</td>
    <td>${u.active?'<span class="pill" style="background:#173A24;color:#5FE39A">Active</span>':'<span class="pill" style="background:#3B1E1E;color:#E5555C">Inactive</span>'}</td><td>${u.createdAt ? fmtDateOnly(u.createdAt) : 'System'}</td>
    <td style="display:flex;gap:6px;"><button class="btn small secondary" onclick="openEditUserModal('${u.id}')">Edit</button>${u.id!==currentUser?.id ? `<button class="btn small secondary" onclick="resendWelcome('${u.id}')">${u.welcomeEmail==='sent'?'Resend Email':'Send Email'}</button>` : ''}${currentUser && currentUser.role === 'owner_admin' && u.id !== currentUser.id ? `<button class="btn small secondary" style="color:var(--danger);padding:4px 8px;font-size:11px;" onclick="deleteUser('${u.id}')">Delete</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
}
function openCreateUserModal(){
  openEntityModal('Create New User Account', 'Add a team member with role-based access', [
    {id:'name',label:'Full Name',span2:true},
    {id:'email',label:'Email Address',span2:true},
    {id:'password',label:'Password (min 8 characters)',type:'password',span2:true},
    {id:'confirmPassword',label:'Confirm Password',type:'password',span2:true},
    {id:'role',label:'Role',type:'select',options:[
      {value:'owner_admin',label:'Owner / Admin — Full access'},
      {value:'dispatcher',label:'Dispatcher — Manage loads & assignments'},
      {value:'accounting',label:'Accounting — Revenue & invoices'},
      {value:'safety',label:'Safety — Compliance & alerts'},
      {value:'driver',label:'Driver — Driver portal access'},
      {value:'customer',label:'Customer — Customer portal access'},
    ]},
    {id:'driverId',label:'Linked Driver (for Driver role)',type:'select',options:[{value:'',label:'— None —'},...DB.drivers.map(d=>({value:d.id,label:d.name}))]},
    {id:'customerId',label:'Linked Customer (for Customer role)',type:'select',options:[{value:'',label:'— None —'},...DB.customers.map(c=>({value:c.id,label:c.name}))]},
  ], {}, ()=>{
    const g=k=>document.getElementById('ent_'+k).value;
    const email = g('email').trim().toLowerCase();
    const password = g('password').trim();
    const confirmPassword = g('confirmPassword').trim();

    if(!g('name').trim() || !email || !password) { alert('All fields required'); return false; }
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { alert('Enter a valid email address, like name@company.com'); return false; }
    if(password.length < 8) { alert('Password must be at least 8 characters'); return false; }
    if(password !== confirmPassword) { alert('Passwords do not match'); return false; }
    if(DB.users.find(u=>String(u.email||'').trim().toLowerCase()===email)) { alert('Email already exists'); return false; }

    const now = new Date().toISOString();
    DB.users.push({
      id:'u'+Date.now(),
      email,
      name:g('name').trim(),
      password,
      role:g('role'),
      driverId:g('driverId')||null,
      customerId:g('customerId')||null,
      active:true,
      createdAt:now,
    });
    saveDB();
    const created = DB.users.find(u=>u.email===email);
    renderUsers(document.getElementById('main'));
    const base = `✅ User Created!\n\nEmail: ${email}\nPassword: (the one you just set)\n\nShare the password with the user securely.`;
    if(!emailLive()){
      created.welcomeEmail = 'not_sent_demo'; saveDB(); renderUsers(document.getElementById('main'));
      alert(base + `\n\n✉ No confirmation email was sent — Email Delivery is in demo mode. Turn it on under Users → ✉ Email Delivery.`);
    } else {
      sendWelcomeEmail(created).then(r=>{
        renderUsers(document.getElementById('main'));
        alert(base + (r.ok ? `\n\n✉ Confirmation email sent to ${email}.` : `\n\n✗ The confirmation email could not be sent: ${r.error}\nYou can retry with “Resend Email” on the Users page.`));
      });
    }
  });
}
function openEditUserModal(id){
  const u = DB.users.find(x=>x.id===id);
  if(!u) return;
  openEntityModal(`Edit User — ${u.name}`, '', [
    {id:'name',label:'Full Name',span2:true},
    {id:'role',label:'Role',type:'select',options:[
      {value:'owner_admin',label:'Owner / Admin'},
      {value:'dispatcher',label:'Dispatcher'},
      {value:'accounting',label:'Accounting'},
      {value:'safety',label:'Safety'},
      {value:'driver',label:'Driver'},
      {value:'customer',label:'Customer'},
    ]},
    {id:'active',label:'Status',type:'select',options:[{value:true,label:'Active'},{value:false,label:'Inactive'}]},
    {id:'newPassword',label:'New Password (leave blank to keep current)',type:'password',span2:true},
    {id:'driverId',label:'Linked Driver (for Driver role)',type:'select',options:[{value:'',label:'— None —'},...DB.drivers.map(d=>({value:d.id,label:d.name}))]},
    {id:'customerId',label:'Linked Customer (for Customer role)',type:'select',options:[{value:'',label:'— None —'},...DB.customers.map(c=>({value:c.id,label:c.name}))]},
  ], {name:u.name, role:u.role, active:u.active, driverId:u.driverId||'', customerId:u.customerId||''}, ()=>{
    const g=k=>document.getElementById('ent_'+k).value;
    const np = (g('newPassword')||'').trim();
    if(np && np.length < 8){ alert('New password must be at least 8 characters'); return false; }
    if(np) u.password = np;
    u.name = g('name').trim();
    u.role = g('role');
    u.active = g('active')==='true' || g('active')===true;
    u.driverId = g('driverId')||null;
    u.customerId = g('customerId')||null;
    if(u.id===currentUser?.id && !u.active){ alert("You can't deactivate your own account."); u.active = true; }
    saveDB();
    renderUsers(document.getElementById('main'));
  });
}

function deleteUser(userId){
  const u = DB.users.find(x=>x.id===userId);
  if(!u) return;
  if(!confirm(`Delete user: ${u.name} (${u.email})?\n\nThis action cannot be undone.`)) return;

  const idx = DB.users.findIndex(x=>x.id===userId);
  if(idx > -1){
    DB.users.splice(idx, 1);
    saveDB();
    alert(`✓ User "${u.name}" deleted successfully`);
    renderUsers(document.getElementById('main'));
  }
}
